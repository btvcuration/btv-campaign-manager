<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B tv Campaign Agent</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.0/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react"
      }
    }
  </script>

  <style>
    body { margin: 0; padding: 0; background-color: #0f111a; font-family: 'Pretendard', -apple-system, sans-serif; color: #cbd5e1; overflow: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2e3038; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #44464f; }
    /* 프로그레스 바 애니메이션 */
    .progress-stripes { background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent); background-size: 1rem 1rem; animation: progress-stripes 1s linear infinite; }
    @keyframes progress-stripes { from { background-position: 1rem 0; } to { background-position: 0 0; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    
    import { 
      Tv, LayoutTemplate, Send, ChevronRight, ChevronDown, ChevronUp, Copy, CheckCircle, 
      Search, Mic, Menu, Home, Grid, Settings, Calendar, GitMerge, Plus, PlusCircle, Trash2, 
      Image as ImageIcon, ListTodo, Smartphone, LayoutPanelLeft, MonitorPlay, Sparkles, Bot, 
      X, User, ExternalLink, Monitor, Layout, Type, RectangleHorizontal, FileText, CalendarDays, MessageSquare, Loader2, Lock, Users, Download
    } from 'lucide-react';

    const GNB_OPTIONS = ['홈', 'Btv+', '영화시리즈', 'TV 방송', '무료', '애니메이션', '해피시니어', '키즈', 'OTT홈', '실시간 채널', '광고 홈', '콘텐츠', '기타'];

    const TEMPLATE_URLS = {
      'TODAY_BTV': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/today_btv.png',
      'GENERAL_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png',
      'FULL_PROMO_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/full_promo.png',
      'BIG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/big_banner.png',
      'LONG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/long_banner.png',
      'STRIP_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/strip_banner.png',
      'SYNOPSIS_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/synopsis_banner.png',
      'PROMO_POPUP': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/promo_popup.png',
      'MINI_EPG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/mini_epg.png'
    };

    const BANNER_SPECS = [
      { type: 'TODAY_BTV', name: 'Today B tv', icon: MonitorPlay, ratio: '16:9', desc: '홈 최상단 대형 배너. 75% 이미지 배치.' },
      { type: 'GENERAL_BANNER', name: '일반 배너', icon: LayoutPanelLeft, ratio: '가변', desc: '배경 프리뷰와 하단 배너 카드 세트.' },
      { type: 'FULL_PROMO_BANNER', name: '풀프로모션', icon: LayoutTemplate, ratio: '16:9', desc: '공통 배경 위에 메인 카피와 3개 카드 세트.' },
      { type: 'BIG_BANNER', name: '빅배너', icon: Monitor, ratio: '24.5:8.3', desc: '텍스트와 우측 이미지로 구성된 대형 영역.' },
      { type: 'LONG_BANNER', name: '롱배너', icon: Smartphone, ratio: '129:181', desc: '세로형 긴 배너. 카피 가독성 중요.' },
      { type: 'STRIP_BANNER', name: '띠배너', icon: RectangleHorizontal, ratio: '가변', desc: '콘텐츠 사이 삽입되는 가로형 긴 띠배너.' },
      { type: 'SYNOPSIS_BANNER', name: '시놉시스 배너', icon: RectangleHorizontal, ratio: '가변', desc: '시놉시스 화면에 노출되는 쿠폰/할인 띠배너.' },
      { type: 'PROMO_POPUP', name: 'TV 팝업', icon: Sparkles, ratio: '4:3', desc: '중앙 팝업 공지. 이미지와 하단 액션 버튼.' },
      { type: 'MINI_EPG_BANNER', name: '미니 EPG 배너', icon: Tv, ratio: '가변', desc: '실시간 방송 시청 중 노출되는 썸네일.' }
    ];

    const getAssetIcon = (type) => {
      const spec = BANNER_SPECS.find(s => s.type === type);
      const IconComponent = spec ? spec.icon : LayoutTemplate;
      return <IconComponent size={14} />;
    };

    const DEFAULT_MINI_EPG_BANNER = { imageUrl: '', buttonText: '감상하기', landingValue: 'UI_PATH: /join', gnb: '실시간 채널', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_TODAY_BTV = { topText: '상단 문구', mainTitle: '메인 문구', subText: '서브 텍스트', landingValue: 'UI_PATH: /join', buttonText: '자세히 보기', imageUrl: '', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_GENERAL_BANNER = { colType: '2단', previewTitle: '배경 좌상단 텍스트 (1줄)', previewSub: '서브 설명글 영역', previewImg: '', bannerCopy: '배너 내 텍스트', bannerImg: '', landingValue: 'UI_PATH: /join', gnb: '영화시리즈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_FULL_PROMO_BANNER = { bgImg: '', topLogo: '상단 타이틀', mainCopy: '메인 하이라이트 문구', subCopy: '서브 텍스트 라인', card1Title: '블룸 하우스', card1Sub: '카드 1 설명', card1Img: '', card1Landing: '', card2Title: '블룸 하우스', card2Sub: '카드 2 설명', card2Img: '', card2Landing: '', card3Title: '블룸 하우스', card3Sub: '카드 3 설명', card3Img: '', card3Landing: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_BIG_BANNER = { subType: '기본형', mainTitle: '메인 문구', subTitle: '서브 타이틀', desc: '상세 설명글을 입력해주세요.', buttonText: '바로가기', imageUrl: '', logoImg: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_LONG_BANNER = { copy: '세로형 배너 메인 카피', subTitle: '서브 카피 입력', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_STRIP_BANNER = { mainTitle: '메인 이벤트 타이틀', subTitle: '서브 프로모션 텍스트', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '이벤트', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_SYNOPSIS_BANNER = { mainTitle: '2,000명 추첨 증정', subTitle: '~7.20 | 다음날 발급', imageUrl: '', badgeText: '영화 쿠폰\n3,300원', landingValue: 'UI_PATH: /join', gnb: '콘텐츠', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_PROMO_POPUP = { imageUrl: '', buttonText: '바로가기', closeText: '닫기', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };

    const DraggableMemo = ({ memo, updateMemo, removeMemo }) => {
      const [pos, setPos] = useState({ x: memo.x || 50, y: memo.y || 50 });
      const isDragging = useRef(false);
      const dragStart = useRef({ mouseX: 0, mouseY: 0, boxX: 0, boxY: 0 });

      useEffect(() => { setPos({ x: memo.x || 50, y: memo.y || 50 }); }, [memo.x, memo.y]);

      const handleMouseDown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        
        e.preventDefault(); e.stopPropagation();
        isDragging.current = true;
        dragStart.current = { mouseX: e.clientX, mouseY: e.clientY, boxX: pos.x, boxY: pos.y };

        const handleMouseMove = (ev) => {
          if (!isDragging.current) return;
          ev.preventDefault();
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          setPos({ x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
        };

        const handleMouseUp = (ev) => {
          if (!isDragging.current) return;
          isDragging.current = false;
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          updateMemo(memo.id, { x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
          
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove, { passive: false });
        document.addEventListener('mouseup', handleMouseUp);
      };

      return (
        <div 
          onMouseDown={handleMouseDown}
          className="absolute bg-yellow-300/95 backdrop-blur-sm px-4 py-3 rounded-xl shadow-2xl border border-yellow-400 min-w-[200px] max-w-[300px] transition-shadow hover:shadow-[0_0_20px_rgba(250,204,21,0.6)] cursor-move z-50 pointer-events-auto"
          style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`, left: 0, top: 0, willChange: 'transform' }}
        >
          <div className="flex items-center justify-between gap-4 mb-2 pointer-events-none">
            <div className="flex items-center gap-1.5 text-yellow-800 font-bold text-[10px]"><MessageSquare size={12}/> 시안 메모</div>
            <button onMouseDown={(e) => e.stopPropagation()} onClick={() => removeMemo(memo.id)} className="pointer-events-auto text-yellow-700 hover:text-red-600 hover:bg-yellow-400 p-1 rounded-full transition-colors"><X size={12}/></button>
          </div>
          <textarea 
            onMouseDown={(e) => e.stopPropagation()}
            value={memo.text} 
            onChange={(e) => updateMemo(memo.id, { text: e.target.value })}
            className="w-full bg-yellow-100/50 border border-yellow-400/30 rounded p-2 text-xs text-yellow-900 font-bold outline-none resize-none focus:bg-white focus:ring-1 focus:ring-yellow-500 custom-scrollbar h-[60px] cursor-text pointer-events-auto"
            placeholder="여기에 메모를 입력하세요..."
          />
        </div>
      );
    };

    const OverlayMemos = ({ block, onUpdate }) => {
      const memos = block.data?.memos || [];
      if (memos.length === 0) return null;

      const updateMemo = (id, updates) => {
        const updatedMemos = memos.map(m => m.id === id ? { ...m, ...updates } : m);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      const removeMemo = (id) => {
        const updatedMemos = memos.filter(m => m.id !== id);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      return (
        <div className="absolute inset-0 pointer-events-none z-50 overflow-visible">
          {memos.map(memo => (
            <DraggableMemo key={memo.id} memo={memo} updateMemo={updateMemo} removeMemo={removeMemo} />
          ))}
        </div>
      );
    };

    const PreviewDisplay = ({ block }) => {
      if (!block) return null;
      const checkIsUrl = (str) => Boolean(str && typeof str === 'string' && str.startsWith('http'));
      const checkHasText = (str) => Boolean(str && !checkIsUrl(str) && str.trim() !== '');

      const FallbackText = ({ text, alignClass = 'justify-center items-center text-center px-4' }) => {
        if (!checkHasText(text) || checkIsUrl(text)) return null;
        return (
          <div className={`absolute inset-0 flex flex-col sm:flex-row gap-2 ${alignClass} text-white font-black select-none drop-shadow-[0_4px_4px_rgba(0,0,0,0.9)] z-20`}>
            <div className="flex items-center text-white/90 shrink-0 bg-black/20 px-2 py-1 rounded-lg backdrop-blur-sm"><ImageIcon size={22} className="mr-1.5 opacity-90" /><span className="text-sm font-bold tracking-tight">요청 이미지</span></div>
            <span className="text-xl sm:text-2xl truncate leading-tight">{text}</span>
          </div>
        );
      };

      if (block.type === 'TODAY_BTV') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0">
            <div className="absolute inset-0 bg-[#0a0a0f]"></div>
            
            <div className="absolute right-[0%] top-[0%] w-[70%] h-[70%] bg-no-repeat bg-cover bg-right-top z-0" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
              {!checkIsUrl(block.data?.imageUrl) && !checkHasText(block.data?.imageUrl) && <div className="absolute inset-0 bg-gradient-to-bl from-[#1e1b4b] to-[#0a0a0f] opacity-50"></div>}
              <FallbackText text={block.data?.imageUrl} alignClass="justify-end items-start pt-10 pr-10" />
              
              <div className="absolute inset-0 bg-gradient-to-r from-[#0a0a0f] via-transparent to-transparent w-[35%]"></div>
              <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0f] via-transparent to-transparent h-[35%] top-auto bottom-0"></div>
            </div>
            
            <div className="absolute inset-0 w-[50%] bg-gradient-to-r from-[#0a0a0f] via-[#0a0a0f]/95 to-transparent z-10 pointer-events-none"></div>
            <div className="absolute inset-0 top-[40%] bg-gradient-to-t from-[#0a0a0f] via-[#0a0a0f]/90 to-transparent z-10 pointer-events-none"></div>
            
            <div className="absolute inset-0 z-20 flex flex-col pointer-events-none text-white px-10">
              
              <div className="absolute left-[80px] top-[48%] -translate-y-1/2 w-[45%] pl-2">
                <h3 className="text-[#32d782] text-sm font-bold mb-2 tracking-tight">{block.data?.topText || '상단 카피'}</h3>
                <h1 className="text-white text-4xl font-black mb-3 leading-[1.15] whitespace-pre-wrap tracking-tighter drop-shadow-lg">{block.data?.mainTitle || '타이틀 입력'}</h1>
                <p className="text-slate-200 text-sm font-medium leading-[1.6] drop-shadow-md whitespace-pre-wrap">{block.data?.subText || '서브 텍스트'}</p>
                <div className="mt-5 inline-flex bg-[#4631e6] text-white px-6 py-2.5 rounded font-bold text-sm shadow-xl">자세히 보기</div>
              </div>
              
              <div className="absolute bottom-10 left-[80px] right-0 flex gap-3 overflow-hidden">
                {[1,2,3,4,5,6,7].map(i => (
                  <div key={i} className="w-[14%] aspect-[14/9] bg-[#222530] rounded-md border border-white/5 shadow-lg shrink-0">
                  </div>
                ))}
              </div>
            </div>
          </div>
        );
      }
      
      if (block.type === 'FULL_PROMO_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0">
            <div className="absolute inset-0 bg-cover bg-center bg-no-repeat z-0" style={{backgroundImage: checkIsUrl(block.data?.bgImg) ? `url(${block.data.bgImg})` : 'none'}}>
              {!checkIsUrl(block.data?.bgImg) && !checkHasText(block.data?.bgImg) && <div className="absolute inset-0 bg-gradient-to-br from-[#1e1b4b] to-[#0a0a0f]"></div>}
              <FallbackText text={block.data?.bgImg} /><div className="absolute inset-0 bg-black/50 backdrop-blur-[2px]"></div>
            </div>
            <div className="relative z-10 flex flex-col items-center pt-[8%] px-10 gap-4">
              <h2 className="text-white text-[1.8rem] font-black drop-shadow-lg">{block.data?.topLogo || '상단 타이틀'}</h2>
              <div className="w-[10%] h-0.5 bg-white/50 rounded-full mb-2"></div>
              {block.data?.mainCopy && <div className="text-cyan-300 px-6 py-1.5 text-2xl font-black leading-snug whitespace-pre-wrap text-center max-w-[85%] drop-shadow-xl">{block.data.mainCopy}</div>}
              {block.data?.subCopy && <div className="text-purple-300 px-5 py-1 text-sm font-bold leading-snug whitespace-pre-wrap text-center max-w-[80%] drop-shadow-md">{block.data.subCopy}</div>}
            </div>
            <div className="absolute bottom-[8%] left-[5%] right-[5%] flex justify-center gap-6 z-10 h-[40%]">
              {[1,2,3].map(i => (
                <div key={i} className="flex-1 bg-[#0a0812]/90 border border-white/10 rounded-xl flex flex-col overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.8)] ring-1 ring-white/5">
                  <div className="p-4 text-center flex flex-col gap-1 items-center justify-center h-[35%] bg-gradient-to-b from-[#1a1c26] to-[#0a0812]"><h4 className="text-white font-black text-sm truncate w-full">{block.data?.[`card${i}Title`] || `카드 ${i} 타이틀`}</h4><p className="text-yellow-400 text-[10px] font-bold truncate w-full">{block.data?.[`card${i}Sub`] || '서브 텍스트 입력'}</p></div>
                  <div className="flex-1 bg-cover bg-center bg-[#1a1c26] relative" style={{backgroundImage: checkIsUrl(block.data?.[`card${i}Img`]) ? `url(${block.data[`card${i}Img`]})` : 'none'}}>
                    {!checkIsUrl(block.data?.[`card${i}Img`]) && !checkHasText(block.data?.[`card${i}Img`]) && <div className="absolute inset-0 flex items-center justify-center"><ImageIcon size={24} className="text-white/10"/></div>}
                    <FallbackText text={block.data?.[`card${i}Img`]} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      }

      if (block.type === 'GENERAL_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0">
            <div className="absolute inset-0 h-full bg-[#0a0a0f] z-0 px-10">
              <div className="absolute right-0 top-0 w-[65%] h-[60%] bg-no-repeat bg-contain bg-right-top z-0" style={{backgroundImage: checkIsUrl(block.data?.previewImg) ? `url(${block.data.previewImg})` : 'none'}}>
                {!checkIsUrl(block.data?.previewImg) && !checkHasText(block.data?.previewImg) && <div className="absolute inset-0 bg-gradient-to-bl from-indigo-900/30 to-[#0a0a0f]"></div>}
                <FallbackText text={block.data?.previewImg} alignClass="justify-end items-start pt-10 pr-10" />
              </div>
              <div className="absolute inset-0 bg-gradient-to-r from-[#0a0a0f] from-[20%] via-[#0a0a0f]/95 via-[40%] to-transparent to-[60%] z-10 pointer-events-none"></div>
              <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0f] from-[35%] via-[#0a0a0f]/95 via-[50%] to-transparent to-[75%] z-10 pointer-events-none"></div>
              <div className="absolute left-[80px] top-[12%] w-[35%] z-20 flex flex-col gap-2">
                <h1 className="text-white text-[2.2rem] font-black leading-[1.15] whitespace-nowrap overflow-hidden text-ellipsis tracking-tighter drop-shadow-xl">{block.data?.previewTitle || '프리뷰 좌상단 텍스트 (1줄)'}</h1>
                <p className="text-slate-300 text-[16px] font-medium leading-[1.2] whitespace-pre-wrap mt-2">{block.data?.previewSub || '서브 설명글 영역\n2줄에서 3줄 정도 작성 요망'}</p>
              </div>
            </div>
            <div className="absolute bottom-[12%] left-[80px] right-0 flex items-center gap-4 z-30 overflow-hidden pr-8 h-[185px]">
              <div className={`relative rounded-xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.8)] border-[3px] border-[#7387FF] flex bg-[#1a1c26] shrink-0 h-full ${block.data?.colType === '1단' ? 'aspect-[62/89] flex-col' : block.data?.colType === '3단' ? 'aspect-[196/89]' : 'aspect-[129/89]'}`}>
                {block.data?.colType === '1단' ? (
                  <>
                    {block.data?.bannerCopy && <div className="w-full h-[45%] p-5 pb-2 text-left z-20 flex items-start bg-gradient-to-b from-[#1a1c26] to-transparent"><p className="text-white font-extrabold text-xl leading-[1.2] tracking-tighter whitespace-pre-wrap drop-shadow-md">{block.data.bannerCopy}</p></div>}
                    <div className="absolute inset-0 w-full h-full bg-cover bg-center z-10" style={{ backgroundImage: checkIsUrl(block.data?.bannerImg) ? `url(${block.data.bannerImg})` : 'none' }}>
                      {!checkIsUrl(block.data?.bannerImg) && !checkHasText(block.data?.bannerImg) && <div className="absolute inset-0 bg-[#0a0a0f] flex items-center justify-center"><ImageIcon size={20} className="text-white/10"/></div>}
                      <FallbackText text={block.data?.bannerImg} />
                    </div>

        setAssets([...assets, { id: newId, type, name, data: newData }]);
        setActiveTabId(newId);
        setIsAddAssetModalOpen(false);
        setOpenAccordions({ ...openAccordions, banner: true }); 
      };

      const removeAsset = (id, e) => {
        e.stopPropagation();
        if (assets.length <= 1) return alert('최소 1개 제작물은 유지해야 합니다.');
        setAssets(assets.filter(a => a.id !== id));
        if (activeTabId === id) {
          const remainingAssets = assets.filter(a => a.id !== id);
          setActiveTabId(remainingAssets[0].id);
        }
      };

      // 🌟 확장프로그램 다이렉트 ZIP 다운로드 함수
      const handleDownloadExtension = async () => {
        setExportState({ isExporting: true, progress: 10, msg: "최신 확장프로그램 패킹 준비 중..." });
        
        try {
          const zip = new window.JSZip();
          
          // Tool 폴더 내에 있는 실제 파일 목록
          const filesToFetch = [
            "manifest.json",
            "background.js",
            "content.js",
            "content_gemini.js",
            "mermaid.min.js"
          ];

          // 깃허브 원본 파일(Raw) 경로
          const baseUrl = "https://raw.githubusercontent.com/btvcuration/campaign/main/Tool";

          for (let i = 0; i < filesToFetch.length; i++) {
            const fileName = filesToFetch[i];
            const currentProgress = 10 + Math.floor((i / filesToFetch.length) * 60);
            setExportState({ isExporting: true, progress: currentProgress, msg: `${fileName} 가져오는 중...` });
            
            const response = await fetch(`${baseUrl}/${fileName}?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error(`${fileName} 파일을 찾을 수 없습니다.`);
            
            const fileContent = await response.text();
            zip.file(fileName, fileContent);
          }

          setExportState({ isExporting: true, progress: 85, msg: "압축 파일 생성 중..." });
          
          const blob = await zip.generateAsync({ type: "blob" });
          const downloadUrl = URL.createObjectURL(blob);
          
          const link = document.createElement("a");
          link.href = downloadUrl;
          link.download = `btv-campaign-extension-${new Date().toISOString().slice(0,10)}.zip`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(downloadUrl);
          
          setExportState({ isExporting: true, progress: 100, msg: "✅ 최신 버전 다운로드 완료!" });
          
          setTimeout(() => {
            setExportState({ isExporting: false, progress: 0, msg: '' });
            alert("확장 프로그램 다운로드가 완료되었습니다.\n기존 버전 삭제 후 새로 등록하시고 키보드 F5를 눌러 새로고침 해주세요!");
          }, 1500);

        } catch (e) {
          console.error("Extension Download Error:", e);
          setExportState({ isExporting: true, progress: 100, msg: "⚠️ 다운로드 실패" });
          setTimeout(() => setExportState({ isExporting: false, progress: 0, msg: '' }), 3000);
          alert("다운로드 중 오류가 발생했습니다: " + e.message);
        }
      };
      
      const handleExport = async () => {
        if (!assets || assets.length === 0) return alert("전송할 배너 기획안이 없습니다.");
        
        // 🌟 수정: Jira 전송 전 확인 팝업 추가
        const isConfirmed = window.confirm("Jira 일감 전송을 시작하시겠습니까?\n\n확인(OK)을 누르면 화면 캡처가 시작됩니다.\n※ 주의: Jira에 미리 로그인이 되어있어야 정상 작동합니다.");
        if (!isConfirmed) return;

        const meta = campaignMeta || {};
        const myJiraId = localStorage.getItem('myJiraId') || '';
        if (!myJiraId) {
          alert("🚨 지라 전송을 위해 담당자 ID가 필요합니다!");
          return handleSettingsClick();

        const cleanAssignee = myJiraId.split('@')[0].trim();

        setExportState({ isExporting: true, progress: 10, msg: "이미지 추출 준비 중..." });
        let capturedImages = {};

        for (let i = 0; i < assets.length; i++) {
          const asset = assets[i];
          const currentProgress = 10 + Math.floor((i / assets.length) * 40); 
          setExportState({ isExporting: true, progress: currentProgress, msg: `[${asset.name}] 캡처 진행 중...` });
          
          setActiveTabId(asset.id);
          await new Promise(r => setTimeout(r, 800)); 
          
          const element = document.getElementById('capture-preview-area');
          if (element) {
            const rect = element.getBoundingClientRect();
            const cropData = { x: rect.left, y: rect.top, width: rect.width, height: rect.height };

            const dataUrl = await new Promise((resolve) => {
              const timeout = setTimeout(() => { window.removeEventListener('RECEIVE_SCREENSHOT', listener); resolve(null); }, 3000);
              const listener = (e) => { clearTimeout(timeout); window.removeEventListener('RECEIVE_SCREENSHOT', listener); resolve(e.detail.dataUrl); };
              window.addEventListener('RECEIVE_SCREENSHOT', listener);

            if (dataUrl) capturedImages[asset.id] = dataUrl;

            document.body.appendChild(mermaidContainer);

            document.getElementById('mermaid-render-target').innerHTML = svg;

          });
          flowHtml += `</div>`;
          workflowContainer.innerHTML = flowHtml;
          document.body.appendChild(workflowContainer);
          await new Promise(r => setTimeout(r, 1000));
          const workflowCanvas = await window.html2canvas(workflowContainer, canvasOptions);
          workflowDataUrl = workflowCanvas.toDataURL('image/png');
          document.body.removeChild(workflowContainer);

        let parentImagesToUpload = [];

        if (workflowDataUrl) {
          parentImagesToUpload.push({ filename: 'workflow_summary.png', dataUrl: workflowDataUrl });
        }

        const childIssues = assets.map((asset, idx) => {
          const data = asset?.data || {};
          let targetGnbs = Array.isArray(data.gnb) ? data.gnb : [data.gnb || '미지정'];
          if (asset?.type === 'TODAY_BTV') targetGnbs = ['홈'];
          if (asset?.type === 'SYNOPSIS_BANNER') targetGnbs = ['콘텐츠'];
        
          const dateInfo = data.startDate ? `${data.startDate} ~ ${data.dueDate || ''}` : '미지정';
          let copyText = data.mainTitle || data.copy || data.bannerCopy || data.previewTitle || '미지정';
          const imgName = `banner_preview_${idx + 1}.png`;
          
          parentTable += `<tr><td style="padding: 10px;">${idx + 1}</td><td style="padding: 10px; font-weight: bold;">${asset?.name || '미지정'}</td><td style="padding: 10px;">${targetGnbs.join(', ')}</td><td style="padding: 10px; word-break: break-all;">${data.landingValue || '미지정'}</td><td style="padding: 10px;">!${imgName}|width=250!</td></tr>`;
          if (capturedImages[asset.id]) { parentImagesToUpload.push({ filename: imgName, dataUrl: capturedImages[asset.id] }); }

          return {
            title: `[디자인] ${meta.campaignName || "신규 캠페인"} _ ${asset?.name || '미지정'}`, 
            desc: `h3. 🖼️ 상세 기획\n* *편성 GNB*: ${targetGnbs.join(', ')}\n* *담당자 호출*: [~${cleanAssignee}]\n* *편성 일정*: ${dateInfo}\n* *주요 카피*: ${copyText}\n* *랜딩 URL*: ${data.landingValue || '미지정'}\n* *비고*: ${data.note || '없음'}\n\nh3. 🎨 시뮬레이터 캡처 시안\n!preview.png!`, 
            assignee: "", imageData: capturedImages[asset.id], startDate: data.startDate, dueDate: data.dueDate, gnb: targetGnbs 
          };
        });

        parentTable += `</tbody></table>`;

        if (meta.target === 'TARGET') {
          const bannerTypes = assets.map(a => a.name).join(', '); 
          const targetDate = meta.startDate ? `${meta.startDate} ~ ${meta.dueDate || ''}` : '미지정';
          childIssues.push({
            title: `[운영] ${meta.campaignName || "신규 캠페인"} 타겟팅 세팅 요청`,
            desc: `h3. 🎯 타겟팅 캠페인 운영 요청\n* *노출 배너 유형*: ${bannerTypes}\n* *담당자 호출*: [~${cleanAssignee}]\n* *편성 일정*: ${targetDate}\n* *예상 타겟 모수*: ${meta.targetSize || '기획자와 모수 확인 필요'}\n\n위 내용으로 타겟팅 배너 세팅을 요청드립니다.`,
            assignee: '', gnb: ['기타'] 
          });
        }

        const finalData = {
          parent: {
            title: `[캠페인] ${meta.campaignName || "신규 캠페인"}`, 
            desc: `h3. 📌 캠페인 공통 정보\n* *캠페인명*: ${meta.campaignName || "신규 캠페인"}\n* *총 요청 건수*: ${assets.length}건\n\nh3. 🗺️ 고객 이동 경로 (Userflow)\n!workflow_summary.png|width=800!\n\nh3. 📊 배너 편성 종합표\n${parentTable}\n\n----\n하위 작업(Sub-task)으로 개별 배너 상세 기획안이 첨부되어 있습니다.`,
            assignee: cleanAssignee, startDate: meta.startDate, dueDate: meta.dueDate, images: parentImagesToUpload 
          },
          children: childIssues 
        };
        const GOOGLE_FORM_URL = 'https://docs.google.com/forms/u/0/d/e/1FhjD6B8EiPR6-356GvPNRsox1JtB1NDk8hWGCwVwBvo/formResponse';
        // 각 배너(asset)별로 개별 폼 제출 (시트에 1줄씩 기록됨)
        assets.forEach(asset => {
          const data = asset.data || {};
          const gnbStr = Array.isArray(data.gnb) ? data.gnb.join(', ') : (data.gnb || '미지정');
          const mainCopy = data.mainTitle || data.copy || data.bannerCopy || data.previewTitle || data.topLogo || '카피 없음';
          const imgUrl = data.imageUrl || data.bgImg || data.bannerImg || data.previewImg || '';

          // URL-encoded 폼 데이터 생성
          const formData = new URLSearchParams();
          
          // 💡 주의: 아래 entry.숫자들을 Step 2에서 추출한 실제 ID로 교체하세요!
          formData.append('entry.1927772445', /* 캠페인명 */);
          formData.append('entry.1707878045', /* 타겟유형 */);
          formData.append('entry.1703991097', /* 타겟모수 */);
          formData.append('entry.120655574', /* 시작일 */);
          formData.append('entry.1770697492', /* 종료일 */);

          formData.append('entry.2107075545', /* 주요 카피 */);
          formData.append('entry.1498002583', /* 랜딩 URL */);

        const event = new CustomEvent('TEST_JIRA_SEND', { detail: finalData });
        window.dispatchEvent(event);
        
        setExportState({ isExporting: true, progress: 100, msg: "🚀 전송 완료! 잠시 후 Jira가 열립니다." });
        setTimeout(() => setExportState({ isExporting: false, progress: 0, msg: '' }), 4000);
      };

      const activeAsset = assets.find(a => a.id === activeTabId) || assets[0];

      return (
        <div className="flex h-screen w-full bg-[#06070a] text-slate-200 overflow-hidden select-none">
          
          <nav className="w-[72px] bg-[#0f111a] border-r border-[#262833] flex flex-col items-center py-6 z-30 shrink-0 shadow-lg">
            <div className="w-11 h-11 bg-white rounded-xl flex items-center justify-center mb-10 shadow-lg shadow-[#4f3df6]/30">
              <svg id="GA_LOGO_0_IMG_0" xmlns="http://www.w3.org/2000/svg" className="w-8 h-8 text-[#4f3df6] fill-current" viewBox="0 0 64 64">
                <title>SK Broadband</title>
                <path id="GA_LOGO_0_IMG_0_1" d="M45.7,30.9L45.7,30.9l0-0.2c2-2.1,3.1-4.9,3.2-7.8c0-0.7,0-1.5-0.2-2.2c-1.1-5.6-6-9.7-11.7-9.7H13v9.7h22.2c2,0,3.6,1.6,3.6,3.6s-1.6,3.6-3.6,3.6H23.1v-5l-10.1,5v25.2h24.7c7,0,12.6-5.6,12.6-12.6C50.2,36.7,48.5,33.3,45.7,30.9 M35.6,43.5H23.1v-7.8h12.5c2.2,0,3.9,1.7,3.9,3.9S37.8,43.5,35.6,43.5" />

          {isSidebarOpen && (

              <div className="p-6 pb-4 flex flex-col gap-1 border-b border-[#1a1c26] bg-[#0f111a]">

              <div className="flex-1 overflow-y-auto px-4 py-5 space-y-4 custom-scrollbar">

                    <h3 className="text-sm font-bold text-white flex items-center gap-2"><Layout size={16} className="text-[#4f3df6]"/> 캠페인 메타 정보</h3>
                    {openAccordions.campaign ? <ChevronUp size={16} className="text-slate-500"/> : <ChevronDown size={16} className="text-slate-500"/>}
                  </div>
                  
                  {openAccordions.campaign && (

                        <div className="col-span-2"><input type="text" name="campaignName" placeholder="캠페인/프로젝트명" value={campaignMeta.campaignName} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg px-3 py-2.5 text-sm text-white focus:border-[#4f3df6] outline-none transition-all" /></div>

                   </button>
                 )}

                 <button onClick={() => setIsAddAssetModalOpen(true)} className="flex items-center gap-1.5 px-4 py-2 bg-[#1a1c26] text-white rounded-lg text-xs font-bold border border-[#303340] hover:bg-[#262833] transition-colors"><Plus size={14} className="text-[#7387ff]"/> 배너 추가</button>
                 
                 {exportState.isExporting ? (
                   <div className="w-[200px] h-[34px] bg-[#1a1c26] border border-[#4f3df6] rounded-lg overflow-hidden relative flex items-center shadow-[0_0_15px_rgba(79,61,246,0.3)]">
                     <div className="absolute inset-0 bg-[#4f3df6]/20 progress-stripes pointer-events-none"></div>
                     <div className="absolute top-0 left-0 h-full bg-gradient-to-r from-[#4f3df6] to-[#7387ff] transition-all duration-300" style={{width: `${exportState.progress}%`}}></div>
                     <span className="relative z-10 w-full text-center text-[10px] font-bold text-white flex items-center justify-center gap-1.5"><Loader2 size={12} className="animate-spin"/> {exportState.msg}</span>
                   </div>
                 ) : (
                   <button onClick={handleExport} className="flex items-center gap-1.5 px-5 py-2 bg-[#4f3df6] hover:bg-[#6252ff] text-white rounded-lg text-xs font-bold shadow-lg shadow-[#4f3df6]/20 transition-all"><Send size={14}/> Jira 일감 전송</button>
                 )}
               </div>
            </header>

            <div className="flex-1 relative overflow-hidden flex flex-col items-center justify-center p-12 bg-[#06070a]">
              <div className="w-full max-w-[1000px] aspect-[16/9] bg-[#000000] rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.8)] border-[8px] border-[#1a1c26] relative overflow-hidden flex items-center justify-center">
                <div id="capture-preview-area" className="w-full h-full relative">
                   <PreviewDisplay block={activeAsset} localShowSafeZone={localShowSafeZone} />
                   <OverlayMemos block={activeAsset} onUpdate={handleAssetChange} />
                </div>
              </div>
            </div>

            <div className="h-[180px] bg-[#0c0d14] border-t border-[#1a1c26] shrink-0 flex flex-col z-20">
              <div className="flex px-6 py-2.5 justify-between items-center border-b border-[#1a1c26] bg-[#0f111a]">
                <h3 className="text-[11px] font-bold text-slate-400 flex items-center gap-1.5"><ImageIcon size={12}/> Variant Assets ({assets.length})</h3>
              </div>
              
              <div className="flex-1 overflow-x-auto custom-scrollbar flex items-center gap-4 px-6 bg-[#06070a]">
                {assets.map((asset, idx) => (
                  <div 
                    key={asset.id} 
                    className={`relative w-[200px] h-[120px] rounded-xl border-2 transition-all shrink-0 flex flex-col overflow-hidden group cursor-pointer ${activeTabId === asset.id ? 'border-[#4f3df6] shadow-[0_0_15px_rgba(79,61,246,0.3)]' : 'border-[#262833] hover:border-[#4f3df6]/50'}`}
                    onClick={() => setActiveTabId(asset.id)}
                  >
                    <div className="h-[180px] bg-[#0c0d14] border-t border-[#1a1c26] shrink-0 flex flex-col z-20">
                      <div className="absolute top-0 left-0 w-[1000px] origin-top-left transform scale-[0.2]">
                        <PreviewDisplay block={asset} localShowSafeZone={false} />
                      </div>
                      <div className="absolute inset-0 bg-black/10 group-hover:bg-transparent transition-colors"></div>
                    </div>
                    
                    <div className={`h-[32px] px-3 flex justify-between items-center relative ${activeTabId === asset.id ? 'bg-[#4f3df6]' : 'bg-[#12141c]'}`}>
                      <span className={`text-[10px] font-bold truncate pr-4 ${activeTabId === asset.id ? 'text-white' : 'text-slate-300'}`}>{asset.name}</span>
                      {assets.length > 1 && (
                        <button onClick={(e) => removeAsset(asset.id, e)} className={`absolute right-2 opacity-0 group-hover:opacity-100 p-1 rounded-full transition-all ${activeTabId === asset.id ? 'hover:bg-white/20 text-white' : 'hover:bg-red-500/20 text-red-400'}`}>
                          <Trash2 size={10}/>
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </main>

          {isSettingsOpen && (
            <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in zoom-in-95 duration-200">
              <div className="bg-[#12141c] w-[500px] border border-[#262833] rounded-2xl shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/10">
                <div className="p-5 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                  <h3 className="text-base font-black text-white flex items-center gap-2"><Settings size={18} className="text-[#4f3df6]"/> 시스템 설정 (Admin)</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={16}/></button>
                </div>
                
                <div className="p-6 space-y-6 bg-[#0a0812] max-h-[70vh] overflow-y-auto custom-scrollbar">
                  
                  <div className="space-y-3">
                    <h4 className="text-xs font-bold text-[#7387ff] flex items-center gap-1.5"><User size={14}/> 내 계정 연동</h4>
                    <div className="bg-[#1a1c26] p-4 rounded-xl border border-[#262833]">
                      <label className="block text-[10px] text-slate-400 mb-1.5">기본 담당자 Jira ID (이메일)</label>
                      <input type="text" defaultValue={localStorage.getItem('myJiraId') || ''} onBlur={(e) => localStorage.setItem('myJiraId', e.target.value.trim())} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none" placeholder="example@sk.com" />
                      <p className="text-[9px] text-slate-500 mt-2">* 상위/하위 일감 생성 시 기본 담당자(Assignee)로 할당됩니다.</p>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <h4 className="text-xs font-bold text-pink-400 flex items-center gap-1.5"><Users size={14}/> GNB별 자동 멘션 (읽기 전용)</h4>
                    <p className="text-[10px] text-slate-400 leading-snug">
                      현재 팀 내 담당자 매핑 정보입니다. 하위 일감(Sub-task) 생성 시, 선택된 GNB에 따라 해당 담당자에게 Jira 일감이 자동 할당됩니다. (수정 권한은 시스템 관리자에게 있습니다.)
                    </p>
                    
                    <div className="bg-[#1a1c26] rounded-xl border border-[#262833] overflow-hidden">
                      <div className="grid grid-cols-3 gap-0 text-[10px] bg-[#262833] text-slate-300 font-bold">
                        <div className="p-2.5 text-center border-r border-[#1a1c26]">GNB 명칭</div>
                        <div className="col-span-2 p-2.5 pl-4 flex items-center justify-between">담당자 <Lock size={10} className="text-slate-500"/></div>
                      </div>
                      
                      {[
                        { gnb: '영화시리즈', name: '권서영 매니저' },
                        { gnb: 'TV 방송', name: '허유진 매니저' },
                        { gnb: '애니메이션 / 키즈', name: '임예은 매니저' },
                        { gnb: '해피시니어', name: '구정화 매니저' },
                        { gnb: '전체 총괄', name: '구인모 팀장' },
                      ].map((item, i) => (
                        <div key={i} className="grid grid-cols-3 gap-0 text-xs border-t border-[#262833]">
                          <div className="p-2.5 text-center border-r border-[#262833] text-slate-400 flex items-center justify-center">{item.gnb}</div>
                          <div className="col-span-2 p-2.5 pl-4">
                            <input type="text" value={item.name} disabled className="w-full bg-transparent text-white opacity-60 cursor-not-allowed outline-none font-bold" />
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                </div>
                
                <div className="p-4 border-t border-[#262833] bg-[#0f111a] flex justify-end">
                  <button onClick={() => setIsSettingsOpen(false)} className="px-6 py-2 bg-[#4f3df6] hover:bg-[#6252ff] text-white rounded-lg text-xs font-bold transition-all shadow-lg">확인 및 닫기</button>
                </div>
              </div>
            </div>
          )}

          {isAddAssetModalOpen && (
            <div className="fixed inset-0 bg-[#0a0812]/95 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-in zoom-in-95 duration-200">
              <div className="bg-[#12141c] w-[900px] border border-[#262833] rounded-3xl shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/10">
                <div className="p-6 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                  <h3 className="text-xl font-black text-white flex items-center gap-2"><LayoutTemplate size={22} className="text-[#4f3df6]"/> Select Template</h3>
                  <button onClick={() => setIsAddAssetModalOpen(false)} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={20}/></button>
                </div>
                <div className="p-8 grid grid-cols-2 lg:grid-cols-3 gap-5 max-h-[70vh] overflow-y-auto custom-scrollbar bg-[#0a0812]">
                  {BANNER_SPECS.map((spec) => (
                    <div key={spec.type} onClick={() => addAsset(spec.type, spec.name)} className="bg-[#1a1c26] border border-[#262833] rounded-2xl p-6 cursor-pointer hover:border-[#4f3df6] hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(79,61,246,0.2)] transition-all flex flex-col h-full group">
                      <div className="flex items-start justify-between mb-4"><div className="p-3 bg-[#0a0812] border border-[#303340] rounded-xl text-[#7387ff] group-hover:bg-[#4f3df6] group-hover:border-[#4f3df6] group-hover:text-white transition-colors"><spec.icon size={24} /></div><span className="text-[10px] font-bold bg-[#0a0812] border border-[#303340] text-slate-400 px-2 py-1 rounded-md font-mono">{spec.ratio}</span></div>
                      <h4 className="text-lg font-bold text-white mb-1 group-hover:text-[#7387ff] transition-colors">{spec.name}</h4>
                      <p className="text-xs text-slate-500 leading-relaxed mt-auto pt-4 border-t border-[#262833]">{spec.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    } 

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
