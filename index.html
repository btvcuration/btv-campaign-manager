<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>B tv Campaign Manager Pro</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.292.0?external=react"
      }
    }
  </script>

  <style>
    body { margin: 0; padding: 0; background-color: #0f111a; font-family: 'Pretendard', -apple-system, sans-serif; color: #cbd5e1; overflow: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2e3038; border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #44464f; }
    /* 프로그레스 바 애니메이션 */
    .progress-stripes { background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent); background-size: 1rem 1rem; animation: progress-stripes 1s linear infinite; }
    @keyframes progress-stripes { from { background-position: 1rem 0; } to { background-position: 0 0; } }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    
    import { 
      Tv, LayoutTemplate, Send, ChevronRight, ChevronDown, ChevronLeft, Copy, CheckCircle, 
      Search, Mic, Menu, Home, Grid, Settings, Calendar, GitMerge, Plus, PlusCircle, Trash2, 
      Image as ImageIcon, ListTodo, Smartphone, LayoutPanelLeft, MonitorPlay, Sparkles, Bot, 
      X, User, ExternalLink, Monitor, Layout, Type, RectangleHorizontal, FileText, CalendarDays, MessageSquare, Loader2
    } from 'lucide-react';

    const GNB_OPTIONS = [
      '홈', 'Btv+', '영화시리즈', 'TV 방송', '무료', 
      '애니메이션', '해피시니어', '키즈', 'OTT홈', '실시간 채널',
      '광고 홈', '콘텐츠', '기타'
    ];

    const TEMPLATE_URLS = {
      'TODAY_BTV': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/today_btv.png',
      'GENERAL_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png',
      'FULL_PROMO_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/full_promo.png',
      'BIG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/big_banner.png',
      'LONG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/long_banner.png',
      'STRIP_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/strip_banner.png',
      'SYNOPSIS_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/synopsis_banner.png',
      'PROMO_POPUP': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/promo_popup.png',
      'MINI_EPG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/mini_epg.png'
    };

    const BANNER_SPECS = [
      { type: 'TODAY_BTV', name: 'Today B tv', icon: MonitorPlay, ratio: '16:9', size: '3840 x 2160', desc: '홈 최상단 대형 배너. 75% 이미지 배치.' },
      { type: 'GENERAL_BANNER', name: '일반 배너', icon: LayoutPanelLeft, ratio: '가변', size: '1/2/3단', desc: '배경 프리뷰와 하단 배너 카드 세트.' },
      { type: 'FULL_PROMO_BANNER', name: '풀프로모션', icon: LayoutTemplate, ratio: '16:9', size: '전체화면', desc: '공통 배경 위에 메인 카피와 3개 카드 세트.' },
      { type: 'BIG_BANNER', name: '빅배너', icon: Monitor, ratio: '24.5:8.3', size: '2880x1234', desc: '텍스트와 우측 이미지로 구성된 대형 영역.' },
      { type: 'LONG_BANNER', name: '롱배너', icon: Smartphone, ratio: '129:181', size: '800x1600', desc: '세로형 긴 배너. 카피 가독성 중요.' },
      { type: 'STRIP_BANNER', name: '띠배너', icon: RectangleHorizontal, ratio: '가변', size: '가변', desc: '콘텐츠 사이 삽입되는 가로형 긴 띠배너.' },
      { type: 'SYNOPSIS_BANNER', name: '시놉시스 배너', icon: RectangleHorizontal, ratio: '가변', size: '534x160', desc: '시놉시스 화면에 노출되는 쿠폰/할인 띠배너.' },
      { type: 'PROMO_POPUP', name: 'TV 팝업', icon: Sparkles, ratio: '4:3', size: '1000x750', desc: '중앙 팝업 공지. 이미지와 하단 액션 버튼.' },
      { type: 'MINI_EPG_BANNER', name: '미니 EPG 배너', icon: Tv, ratio: '가변', size: '미니 EPG', desc: '실시간 방송 시청 중 노출되는 썸네일.' }
    ];
    
    const getAssetIcon = (type) => {
      const spec = BANNER_SPECS.find(s => s.type === type);
      if (spec) {
        const IconComponent = spec.icon;
        return <IconComponent size={14} />;
      }
      return <LayoutTemplate size={14} />;
    };

    const DEFAULT_MINI_EPG_BANNER = { imageUrl: '', buttonText: '감상하기', landingValue: 'UI_PATH: /join', gnb: '실시간 채널', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_TODAY_BTV = { topText: '상단 문구', mainTitle: '메인 문구', subText: '서브 텍스트', landingValue: 'UI_PATH: /join', buttonText: '자세히 보기', imageUrl: '', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_GENERAL_BANNER = { colType: '2단', previewTitle: '배경 좌상단 텍스트 (1줄)', previewSub: '서브 설명글 영역', previewImg: '', bannerCopy: '배너 내 텍스트', bannerImg: '', landingValue: 'UI_PATH: /join', gnb: '영화시리즈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_FULL_PROMO_BANNER = { bgImg: '', topLogo: '상단 타이틀', mainCopy: '메인 하이라이트 문구', subCopy: '서브 텍스트 라인', card1Title: '블룸 하우스', card1Sub: '카드 1 설명', card1Img: '', card1Landing: '', card2Title: '블룸 하우스', card2Sub: '카드 2 설명', card2Img: '', card2Landing: '', card3Title: '블룸 하우스', card3Sub: '카드 3 설명', card3Img: '', card3Landing: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_BIG_BANNER = { subType: '기본형', mainTitle: '메인 문구', subTitle: '서브 타이틀', desc: '상세 설명글을 입력해주세요.', buttonText: '바로가기', imageUrl: '', logoImg: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_LONG_BANNER = { copy: '세로형 배너 메인 카피', subTitle: '서브 카피 입력', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_STRIP_BANNER = { mainTitle: '메인 이벤트 타이틀', subTitle: '서브 프로모션 텍스트', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '이벤트', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_SYNOPSIS_BANNER = { mainTitle: '2,000명 추첨 증정', subTitle: '~7.20 | 다음날 발급', imageUrl: '', badgeText: '영화 쿠폰\n3,300원', landingValue: 'UI_PATH: /join', gnb: '콘텐츠', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_PROMO_POPUP = { imageUrl: '', buttonText: '바로가기', closeText: '닫기', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };

    const DraggableMemo = ({ memo, updateMemo, removeMemo }) => {
      const [pos, setPos] = useState({ x: memo.x || 100, y: memo.y || 100 });
      const isDragging = useRef(false);
      const dragStart = useRef({ mouseX: 0, mouseY: 0, boxX: 0, boxY: 0 });

      useEffect(() => { setPos({ x: memo.x || 100, y: memo.y || 100 }); }, [memo.x, memo.y]);

      const handleMouseDown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        
        e.preventDefault(); e.stopPropagation();
        isDragging.current = true;
        dragStart.current = { mouseX: e.clientX, mouseY: e.clientY, boxX: pos.x, boxY: pos.y };

        const handleMouseMove = (ev) => {
          if (!isDragging.current) return;
          ev.preventDefault();
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          setPos({ x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
        };

        const handleMouseUp = (ev) => {
          if (!isDragging.current) return;
          isDragging.current = false;
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          updateMemo(memo.id, { x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
          
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove, { passive: false });
        document.addEventListener('mouseup', handleMouseUp);
      };

      return (
        <div 
          onMouseDown={handleMouseDown}
          className="absolute bg-yellow-300/95 backdrop-blur-sm px-4 py-3 rounded-xl shadow-2xl border border-yellow-400 min-w-[200px] max-w-[300px] transition-shadow hover:shadow-[0_0_20px_rgba(250,204,21,0.6)] cursor-move z-50 pointer-events-auto"
          style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`, left: 0, top: 0, willChange: 'transform' }}
        >
          <div className="flex items-center justify-between gap-4 mb-2 pointer-events-none">
            <div className="flex items-center gap-1.5 text-yellow-800 font-bold text-[10px]"><MessageSquare size={12}/> 시안 메모</div>
            <button onMouseDown={(e) => e.stopPropagation()} onClick={() => removeMemo(memo.id)} className="pointer-events-auto text-yellow-700 hover:text-red-600 hover:bg-yellow-400 p-1 rounded-full transition-colors"><X size={12}/></button>
          </div>
          <textarea 
            onMouseDown={(e) => e.stopPropagation()}
            value={memo.text} 
            onChange={(e) => updateMemo(memo.id, { text: e.target.value })}
            className="w-full bg-yellow-100/50 border border-yellow-400/30 rounded p-2 text-xs text-yellow-900 font-bold outline-none resize-none focus:bg-white focus:ring-1 focus:ring-yellow-500 custom-scrollbar h-[60px] cursor-text pointer-events-auto"
            placeholder="여기에 메모를 입력하세요..."
          />
        </div>
      );
    };

    const OverlayMemos = ({ block, onUpdate }) => {
      const memos = block.data?.memos || [];
      if (memos.length === 0) return null;

      const updateMemo = (id, updates) => {
        const updatedMemos = memos.map(m => m.id === id ? { ...m, ...updates } : m);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      const removeMemo = (id) => {
        const updatedMemos = memos.filter(m => m.id !== id);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      return (
        <div className="absolute inset-0 pointer-events-none z-50 overflow-visible">
          {memos.map(memo => (
            <DraggableMemo key={memo.id} memo={memo} updateMemo={updateMemo} removeMemo={removeMemo} />
          ))}
        </div>
      );
    };

    const BlockRenderer = ({ block, onUpdate }) => {
      if (!block) return null;
      const [localShowSafeZone, setLocalShowSafeZone] = useState(false);

      const checkIsUrl = (str) => Boolean(str && typeof str === 'string' && str.startsWith('http'));
      const checkHasText = (str) => Boolean(str && !checkIsUrl(str) && str.trim() !== '');

      const FallbackText = ({ text, alignClass = 'justify-center items-center text-center px-4' }) => {
        if (!checkHasText(text) || checkIsUrl(text)) return null;
        return (
          <div className={`absolute inset-0 flex flex-col sm:flex-row gap-2 ${alignClass} text-white font-black select-none drop-shadow-[0_4px_4px_rgba(0,0,0,0.9)] z-20`}>
            <div className="flex items-center text-white/90 shrink-0 bg-black/20 px-2 py-1 rounded-lg backdrop-blur-sm">
              <ImageIcon size={22} className="mr-1.5 opacity-90" />
              <span className="text-sm font-bold tracking-tight">요청 이미지</span>
            </div>
            <span className="text-xl sm:text-2xl truncate leading-tight">{text}</span>
          </div>
        );
      };

      const handleAddMemo = () => {
        const currentMemos = block.data?.memos || [];
        const offset = currentMemos.length * 20; 
        const newMemo = { id: `memo-${Date.now()}`, text: '', x: 100 + offset, y: 100 + offset };
        onUpdate(block.id, 'memos', [...currentMemos, newMemo]);
      };

      return (
        <div className="absolute inset-0 p-6 flex flex-col xl:flex-row gap-6 animate-in fade-in duration-300">
          {/* 좌측 입력 폼 */}
          <div className="w-full xl:w-[360px] flex-shrink-0 h-full overflow-y-auto custom-scrollbar pr-4 pb-20">
            <div className="space-y-6 pb-8">
              <div className="bg-[#12141c] border border-[#262833] rounded-2xl p-5 shadow-2xl">
                <div className="flex justify-between items-center border-b border-[#262833] pb-4 mb-4">
                  <h3 className="text-base font-extrabold text-white flex items-center gap-2">
                    <span className="p-1.5 bg-[#4f3df6]/20 text-[#7387ff] rounded-lg">
                      {block.type === 'TODAY_BTV' ? <MonitorPlay size={16}/> : block.type === 'FULL_PROMO_BANNER' ? <LayoutTemplate size={16}/> : block.type === 'BIG_BANNER' ? <Monitor size={16}/> : block.type === 'STRIP_BANNER' ? <RectangleHorizontal size={16}/> : <LayoutPanelLeft size={16}/>}
                    </span>
                    {block.name}
                  </h3>
                </div>
                
                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-[#7387ff] mb-1.5 flex items-center gap-1">
                      <Grid size={12}/> GNB <span className="text-[10px] text-slate-500 font-normal ml-1">(다중 선택)</span>
                    </label>
                    <div className="flex flex-wrap gap-1.5">
                      {GNB_OPTIONS.map(opt => {
                        const isFixed = block.type === 'TODAY_BTV' || block.type === 'SYNOPSIS_BANNER' || block.type === 'MINI_EPG_BANNER';
                        let currentGnbs = Array.isArray(block.data?.gnb) ? block.data.gnb : [block.data?.gnb || '홈'];
                        if (block.type === 'TODAY_BTV') currentGnbs = ['홈'];
                        if (block.type === 'SYNOPSIS_BANNER') currentGnbs = ['콘텐츠'];
                        if (block.type === 'MINI_EPG_BANNER') currentGnbs = ['실시간 채널'];
                        const isSelected = currentGnbs.includes(opt);
                        const toggleGnb = () => {
                          if (isFixed) return; 
                          let newGnbs = [...currentGnbs];
                          if (isSelected) {
                             newGnbs = newGnbs.filter(g => g !== opt);
                             if (newGnbs.length === 0) newGnbs = ['홈']; 
                          } else { newGnbs.push(opt); }
                          onUpdate(block.id, 'gnb', newGnbs);
                        };
                        return (
                          <button key={opt} onClick={toggleGnb} disabled={isFixed} className={`px-2.5 py-1 text-[11px] font-bold rounded-lg transition-all ${isSelected ? 'bg-[#4f3df6] text-white shadow-md' : 'bg-[#1a1c26] text-slate-400 border border-[#303340] hover:border-[#7387ff] hover:text-white'} ${isFixed && !isSelected ? 'opacity-30 cursor-not-allowed' : ''}`}>
                            {opt}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* 배너 타입별 폼들 (기존 로직 유지) */}
                  {block.type === 'TODAY_BTV' && (
                    <>
                      <div><label className="block text-xs font-bold text-slate-400 mb-1.5">상단 텍스트</label><input type="text" value={block.data?.topText || ''} onChange={e => onUpdate(block.id, 'topText', e.target.value)} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2 text-sm text-white outline-none focus:border-[#7387ff]" /></div>
                      <div><label className="block text-xs font-bold text-slate-400 mb-1.5">메인 타이틀</label><textarea value={block.data?.mainTitle || ''} onChange={e => onUpdate(block.id, 'mainTitle', e.target.value)} rows={2} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2 text-sm text-white outline-none focus:border-[#7387ff] resize-none" /></div>
                      <div><label className="block text-xs font-bold text-slate-400 mb-1.5">서브 텍스트</label><textarea value={block.data?.subText || ''} onChange={e => onUpdate(block.id, 'subText', e.target.value)} rows={3} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2 text-sm text-white outline-none focus:border-[#7387ff] resize-none" /></div>
                      <div><label className="block text-xs font-bold text-slate-400 mb-1.5">이미지 URL</label><input type="text" value={block.data?.imageUrl || ''} onChange={e => onUpdate(block.id, 'imageUrl', e.target.value)} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2 text-sm text-white outline-none focus:border-[#7387ff]" /></div>
                      <div><label className="block text-xs font-bold text-slate-400 mb-1.5">랜딩값</label><input type="text" value={block.data?.landingValue || ''} onChange={e => onUpdate(block.id, 'landingValue', e.target.value)} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2 text-sm text-white outline-none focus:border-[#7387ff]" /></div>
                    </>
                  )}
                  {block.type === 'FULL_PROMO_BANNER' && (
                    <>
                      <div className="bg-[#0a0812] p-4 rounded-xl border border-[#262833] space-y-3">
                        <div className="text-xs font-bold text-[#7387ff] mb-2"><MonitorPlay size={14} className="inline mr-1"/> 공통 배경</div>
                        <input type="text" placeholder="배경 이미지 URL" value={block.data?.bgImg || ''} onChange={e => onUpdate(block.id, 'bgImg', e.target.value)} className="w-full bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-white outline-none focus:border-[#7387ff]" />
                        <input type="text" placeholder="상단 로고 타이틀" value={block.data?.topLogo || ''} onChange={e => onUpdate(block.id, 'topLogo', e.target.value)} className="w-full bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-white outline-none focus:border-[#7387ff]" />
                        <input type="text" placeholder="메인 하이라이트 문구" value={block.data?.mainCopy || ''} onChange={e => onUpdate(block.id, 'mainCopy', e.target.value)} className="w-full bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-cyan-300 outline-none focus:border-[#7387ff]" />
                        <input type="text" placeholder="서브 라인 문구" value={block.data?.subCopy || ''} onChange={e => onUpdate(block.id, 'subCopy', e.target.value)} className="w-full bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-purple-300 outline-none focus:border-[#7387ff]" />
                      </div>
                      {[1, 2, 3].map(i => (
                        <div key={i} className="bg-[#0a0812] p-4 rounded-xl border border-[#262833] space-y-3">
                          <div className="text-xs font-bold text-slate-300 mb-2"><LayoutPanelLeft size={14} className="inline mr-1"/> 카드 {i}</div>
                          <div className="flex gap-2">
                            <input type="text" placeholder="타이틀" value={block.data?.[`card${i}Title`] || ''} onChange={e => onUpdate(block.id, `card${i}Title`, e.target.value)} className="flex-1 bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-white outline-none focus:border-[#7387ff]" />
                            <input type="text" placeholder="서브" value={block.data?.[`card${i}Sub`] || ''} onChange={e => onUpdate(block.id, `card${i}Sub`, e.target.value)} className="flex-1 bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-yellow-400 outline-none focus:border-[#7387ff]" />
                          </div>
                          <input type="text" placeholder="이미지 URL" value={block.data?.[`card${i}Img`] || ''} onChange={e => onUpdate(block.id, `card${i}Img`, e.target.value)} className="w-full bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-white outline-none focus:border-[#7387ff]" />
                          <input type="text" placeholder="랜딩값" value={block.data?.[`card${i}Landing`] || ''} onChange={e => onUpdate(block.id, `card${i}Landing`, e.target.value)} className="w-full bg-[#12141c] border border-[#303340] rounded-lg p-2 text-xs text-white outline-none focus:border-[#7387ff]" />

      // 🌟 [UI 포인트 1] 인라인 프로그레스 바 상태 관리
      const [exportState, setExportState] = useState({ isExporting: false, progress: 0, msg: '' });

      const handleSettingsClick = () => {
        const currentId = localStorage.getItem('myJiraId') || '';
        const newId = prompt("⚙️ 본인의 Jira ID를 입력해주세요.\n(캠페인 상위 일감의 기본 담당자로 자동 할당되며, 하위 일감에 자동 멘션됩니다.)", currentId);
        if (newId !== null) {
          localStorage.setItem('myJiraId', newId.trim());
          setExportState({ isExporting: true, progress: 100, msg: `✅ Jira ID 저장 완료: ${newId.trim()}`});
          setTimeout(() => setExportState({ isExporting: false, progress: 0, msg: '' }), 3000);
        }
      };

      const lastPayloadStr = useRef("");

      useEffect(() => {
        const handleAiData = (event) => {
          const payload = event.detail;
          if (!payload || payload.action !== "CREATE_CAMPAIGN_ASSETS") return;

          const currentPayloadStr = JSON.stringify(payload);
          if (lastPayloadStr.current === currentPayloadStr) return;
          lastPayloadStr.current = currentPayloadStr;
          setTimeout(() => { lastPayloadStr.current = ""; }, 1500); 

          if (payload.mermaidCode) setMermaidCode(payload.mermaidCode);

          if (payload.campaignMeta) {
            setCampaignMeta(prev => ({ 
              ...prev, 
              campaignName: payload.campaignMeta.campaignName || prev.campaignName,
              target: payload.campaignMeta.target || prev.target,
              targetSize: payload.campaignMeta.targetSize || prev.targetSize,
              startDate: payload.campaignMeta.startDate || prev.startDate,
              dueDate: payload.campaignMeta.dueDate || prev.dueDate
            }));
          }

          if (payload.assets && Array.isArray(payload.assets)) {
            const timestamp = Date.now();
            const newAssets = payload.assets.map((aiAsset, index) => {
              let baseData = {};
              if (aiAsset.type === 'TODAY_BTV') baseData = { ...DEFAULT_TODAY_BTV };
              else if (aiAsset.type === 'GENERAL_BANNER') baseData = { ...DEFAULT_GENERAL_BANNER };
              else if (aiAsset.type === 'FULL_PROMO_BANNER') baseData = { ...DEFAULT_FULL_PROMO_BANNER };
              else if (aiAsset.type === 'BIG_BANNER') baseData = { ...DEFAULT_BIG_BANNER };
              else if (aiAsset.type === 'LONG_BANNER') baseData = { ...DEFAULT_LONG_BANNER };
              else if (aiAsset.type === 'STRIP_BANNER') baseData = { ...DEFAULT_STRIP_BANNER };
              else if (aiAsset.type === 'SYNOPSIS_BANNER') baseData = { ...DEFAULT_SYNOPSIS_BANNER };
              else if (aiAsset.type === 'PROMO_POPUP') baseData = { ...DEFAULT_PROMO_POPUP };
              else if (aiAsset.type === 'MINI_EPG_BANNER') baseData = { ...DEFAULT_MINI_EPG_BANNER };

              let rawGnb = aiAsset.data?.gnb || baseData.gnb;
              let gnbArray = Array.isArray(rawGnb) ? rawGnb : [rawGnb];
              let cleanedGnb = gnbArray.map(g => {
                if (g.includes('영화') && g.includes('시리즈')) return '영화시리즈';
                if (g.includes('TV') && g.includes('방송')) return 'TV 방송';
                if (g === 'OTT 홈' || g === 'OTT') return 'OTT홈';
                return g;
              });

              return {
                id: `ai-asset-${index}-${timestamp}`,
                type: aiAsset.type,
                name: aiAsset.name || `${aiAsset.type.replace('_', ' ')} (AI)`, 
                data: { ...baseData, ...aiAsset.data, gnb: cleanedGnb, startDate: payload.campaignMeta?.startDate || baseData.startDate, dueDate: payload.campaignMeta?.dueDate || baseData.dueDate } 
              };
            });

            setAssets(newAssets);
            setActiveTabId(newAssets[0].id); // 오버뷰 탭이 사라졌으므로 첫 번째 배너 포커스
            
            setExportState({ isExporting: true, progress: 100, msg: `🎉 AI 기획안(${newAssets.length}건) 생성 완료!`});
            setTimeout(() => setExportState({ isExporting: false, progress: 0, msg: '' }), 3000);

        window.addEventListener('RECEIVE_AI_DATA', handleAiData);
        return () => window.removeEventListener('RECEIVE_AI_DATA', handleAiData);

        let newData = {};
        if (type === 'TODAY_BTV') newData = { ...DEFAULT_TODAY_BTV };

        setAssets([...assets, { id: newId, type, name, data: newData }]);

        e.stopPropagation();
        if (assets.length === 1) return alert('최소 1개 제작물은 유지해야 합니다.');
        setAssets(assets.filter(a => a.id !== id));
        if (activeTabId === id) setActiveTabId(assets[0].id);
      };

      // 🌟 Jira Export + Progress Bar 연동
      const handleExport = async () => {
        if (!assets || assets.length === 0) return alert("전송할 배너 기획안이 없습니다.");
        const meta = campaignMeta || {};

        const myJiraId = localStorage.getItem('myJiraId') || '';
        if (!myJiraId) {
          alert("🚨 지라 전송을 위해 담당자 ID가 필요합니다!");
          return handleSettingsClick();
        }
        const cleanAssignee = myJiraId.split('@')[0].trim();

        setExportState({ isExporting: true, progress: 10, msg: "이미지 추출 준비 중..." });
        let capturedImages = {};

        for (let i = 0; i < assets.length; i++) {
          const asset = assets[i];
          const currentProgress = 10 + Math.floor((i / assets.length) * 40); // 10% ~ 50%
          setExportState({ isExporting: true, progress: currentProgress, msg: `[${asset.name}] 캡처 진행 중...` });
          
          setActiveTabId(asset.id);
          await new Promise(r => setTimeout(r, 800)); 
          
          const element = document.getElementById('capture-preview-area');
          if (element) {
            const rect = element.getBoundingClientRect();
            const cropData = { x: rect.left, y: rect.top, width: rect.width, height: rect.height };

            const dataUrl = await new Promise((resolve) => {
              const timeout = setTimeout(() => { window.removeEventListener('RECEIVE_SCREENSHOT', listener); resolve(null); }, 3000);
              const listener = (e) => { clearTimeout(timeout); window.removeEventListener('RECEIVE_SCREENSHOT', listener); resolve(e.detail.dataUrl); };
              window.addEventListener('RECEIVE_SCREENSHOT', listener);
              window.dispatchEvent(new CustomEvent('REQUEST_SCREENSHOT', { detail: cropData }));
            });
            if (dataUrl) capturedImages[asset.id] = dataUrl;
          }
        }

        setExportState({ isExporting: true, progress: 60, msg: "워크플로우 플로우차트 생성 중..." });

        let workflowDataUrl = null;
        const canvasOptions = { backgroundColor: '#0f111a', scale: 2, useCORS: true, allowTaint: true };

        if (mermaidCode && mermaidCode.trim().length > 0) {
          try {
            let finalMermaidCode = mermaidCode;
            assets.forEach(asset => {
              const tplUrl = TEMPLATE_URLS[asset.type];
              if (tplUrl && capturedImages[asset.id]) { finalMermaidCode = finalMermaidCode.replace(tplUrl, capturedImages[asset.id]); }
            });
            const mermaidContainer = document.createElement('div');
            mermaidContainer.style.cssText = 'position:absolute; top:0; left:0; width:1400px; background:#0f111a; padding:50px; border-radius:20px; color:white; z-index:-9999; font-family:Pretendard, sans-serif;';
            mermaidContainer.innerHTML = `<div style="width:100%; text-align:left; margin-bottom:40px; border-bottom:2px solid #262833; padding-bottom:15px;"><h2 style="color:#7387ff; margin:0; font-size:28px; font-weight:900;">🎯 B tv Campaign Userflow</h2><p style="color:#cbd5e1; margin:8px 0 0 0; font-size:16px;">${meta.campaignName || "신규 캠페인"}</p></div><div id="mermaid-render-target"></div>`;
            document.body.appendChild(mermaidContainer);

            mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose', maxTextSize: 50000000 });
            const { svg } = await mermaid.render('mermaid-export-svg', finalMermaidCode);
            document.getElementById('mermaid-render-target').innerHTML = svg;

            await new Promise(r => setTimeout(r, 1500));
            const workflowCanvas = await window.html2canvas(mermaidContainer, canvasOptions);
            workflowDataUrl = workflowCanvas.toDataURL('image/png');
            document.body.removeChild(mermaidContainer);
          } catch (error) { console.error(error); }
        }

        if (!workflowDataUrl) {
          const workflowContainer = document.createElement('div');
          workflowContainer.style.cssText = 'position:absolute; top:0; left:0; width:1400px; background:#0f111a; padding:50px; border-radius:20px; display:flex; flex-direction:column; align-items:center; color:white; font-family:Pretendard, sans-serif; z-index:-9999;';
          let flowHtml = `<div style="width:100%; text-align:left; margin-bottom:40px; border-bottom:2px solid #262833; padding-bottom:15px;"><h2 style="color:#7387ff; margin:0; font-size:28px; font-weight:900;">🎯 B tv Campaign Userflow</h2><p style="color:#cbd5e1; margin:8px 0 0 0; font-size:16px;">${meta.campaignName || "신규 캠페인"}</p></div><div style="display:flex; align-items:center; justify-content:center; gap:20px; width:100%; flex-wrap:wrap;">`;
          assets.forEach((asset, idx) => {
             const imgData = capturedImages[asset.id];
             flowHtml += `<div style="display:flex; flex-direction:column; align-items:center; width:280px;"><div style="width:100%; background:#1a1c26; padding:15px; border-radius:16px; border:1px solid #303340; box-shadow:0 10px 25px rgba(0,0,0,0.5);"><img src="${imgData}" style="width:100%; border-radius:8px; object-fit:contain; display:block;" /></div><div style="margin-top:20px; text-align:center;"><span style="background:#4f3df6; color:white; padding:5px 12px; border-radius:20px; font-size:13px; font-weight:bold;">Step ${idx + 1}</span><p style="margin:10px 0 0 0; font-size:15px; font-weight:bold; color:#e2e8f0; word-break:keep-all;">${asset.name}</p><p style="margin:5px 0 0 0; font-size:12px; color:#7387ff; font-weight:bold;">[${asset.data?.gnb || '미지정'}]</p></div></div>`;
             if (idx < assets.length - 1) { flowHtml += `<div style="color:#7387ff; font-size:32px; font-weight:bold; margin-bottom:50px;">➔</div>`; }
          });
          flowHtml += `</div>`;
          workflowContainer.innerHTML = flowHtml;
          document.body.appendChild(workflowContainer);
          await new Promise(r => setTimeout(r, 1000));
          const workflowCanvas = await window.html2canvas(workflowContainer, canvasOptions);
          workflowDataUrl = workflowCanvas.toDataURL('image/png');
          document.body.removeChild(workflowContainer);
        }

        setExportState({ isExporting: true, progress: 85, msg: "Jira API 데이터 전송 중..." });

        let parentTable = `<table border="1" style="border-collapse: collapse; width: 100%; text-align: center; font-size: 13px;"><tbody><tr style="background-color: #f4f5f7; color: #333;"><td style="padding: 10px; font-weight: bold; width: 5%;">순번</td><td style="padding: 10px; font-weight: bold; width: 25%;">배너명</td><td style="padding: 10px; font-weight: bold; width: 15%;">편성 GNB</td><td style="padding: 10px; font-weight: bold; width: 25%;">랜딩 URL</td><td style="padding: 10px; font-weight: bold; width: 30%;">시안 미리보기</td></tr>`;
        let parentImagesToUpload = [];

        if (workflowDataUrl) {
          parentImagesToUpload.push({ filename: 'workflow_summary.png', dataUrl: workflowDataUrl });
        }

        const childIssues = assets.map((asset, idx) => {
          const data = asset?.data || {};
          let targetGnbs = Array.isArray(data.gnb) ? data.gnb : [data.gnb || '미지정'];
          if (asset?.type === 'TODAY_BTV') targetGnbs = ['홈'];
          if (asset?.type === 'SYNOPSIS_BANNER') targetGnbs = ['콘텐츠'];
        
          const dateInfo = data.startDate ? `${data.startDate} ~ ${data.dueDate || ''}` : '미지정';
          let copyText = data.mainTitle || data.copy || data.bannerCopy || data.previewTitle || '미지정';
          const imgName = `banner_preview_${idx + 1}.png`;
          
          parentTable += `<tr><td style="padding: 10px;">${idx + 1}</td><td style="padding: 10px; font-weight: bold;">${asset?.name || '미지정'}</td><td style="padding: 10px;">${targetGnbs.join(', ')}</td><td style="padding: 10px; word-break: break-all;">${data.landingValue || '미지정'}</td><td style="padding: 10px;">!${imgName}|width=250!</td></tr>`;
          if (capturedImages[asset.id]) { parentImagesToUpload.push({ filename: imgName, dataUrl: capturedImages[asset.id] }); }

          return {
            title: `[디자인] ${meta.campaignName || "신규 캠페인"} _ ${asset?.name || '미지정'}`, 
            desc: `h3. 🖼️ 상세 기획\n* *편성 GNB*: ${targetGnbs.join(', ')}\n* *담당자 호출*: [~${cleanAssignee}]\n* *편성 일정*: ${dateInfo}\n* *주요 카피*: ${copyText}\n* *랜딩 URL*: ${data.landingValue || '미지정'}\n* *비고*: ${data.note || '없음'}\n\nh3. 🎨 시뮬레이터 캡처 시안\n!preview.png!`, 
            assignee: "", 
            imageData: capturedImages[asset.id],
            startDate: data.startDate, dueDate: data.dueDate, gnb: targetGnbs 
          };
        });

        parentTable += `</tbody></table>`;

        if (meta.target === 'TARGET') {
          const bannerTypes = assets.map(a => a.name).join(', '); 
          const targetDate = meta.startDate ? `${meta.startDate} ~ ${meta.dueDate || ''}` : '미지정';
          childIssues.push({
            title: `[운영] ${meta.campaignName || "신규 캠페인"} 타겟팅 세팅 요청`,
            desc: `h3. 🎯 타겟팅 캠페인 운영 요청\n* *노출 배너 유형*: ${bannerTypes}\n* *담당자 호출*: [~${cleanAssignee}]\n* *편성 일정*: ${targetDate}\n* *예상 타겟 모수*: ${meta.targetSize || '기획자와 모수 확인 필요'}\n\n위 내용으로 타겟팅 배너 세팅을 요청드립니다.`,
            assignee: '', gnb: ['기타'] 
          });
        }

        const finalData = {
          parent: {
            title: `[캠페인] ${meta.campaignName || "신규 캠페인"}`, 
            desc: `h3. 📌 캠페인 공통 정보\n* *캠페인명*: ${meta.campaignName || "신규 캠페인"}\n* *총 요청 건수*: ${assets.length}건\n\nh3. 🗺️ 고객 이동 경로 (Userflow)\n!workflow_summary.png|width=800!\n\nh3. 📊 배너 편성 종합표\n${parentTable}\n\n----\n하위 작업(Sub-task)으로 개별 배너 상세 기획안이 첨부되어 있습니다.`,
            assignee: cleanAssignee, startDate: meta.startDate, dueDate: meta.dueDate, images: parentImagesToUpload 
          },
          children: childIssues 
        };
        
        const event = new CustomEvent('TEST_JIRA_SEND', { detail: finalData });
        window.dispatchEvent(event);
        
        setExportState({ isExporting: true, progress: 100, msg: "🚀 백그라운드 전송 중! 잠시 후 Jira가 열립니다." });
        setTimeout(() => setExportState({ isExporting: false, progress: 0, msg: '' }), 4000);
      };

      const activeAsset = assets.find(a => a.id === activeTabId) || assets[0]; // fallback 방어

      return (
        <div className="flex h-screen w-full bg-[#0a0812] text-slate-200 overflow-hidden select-none">
          
          {/* 슬림 네비게이션 */}
          <nav className="w-[72px] bg-[#0f111a] border-r border-[#262833] flex flex-col items-center py-6 z-30 shrink-0">
            <div className="w-11 h-11 bg-gradient-to-br from-[#4f3df6] to-[#7387ff] rounded-xl flex items-center justify-center mb-10 shadow-lg shadow-[#4f3df6]/30">
              <Tv className="text-white" size={24} />
            </div>
            <div className="flex flex-col gap-6 w-full px-3 mb-6">
              <button onClick={() => setIsSidebarOpen(!isSidebarOpen)} className={`w-full aspect-square rounded-xl flex items-center justify-center transition-all ${isSidebarOpen ? 'bg-[#1a1c26] text-white border border-[#303340]' : 'text-slate-500 hover:text-white hover:bg-[#1a1c26]'}`}>
                <Menu size={20} />
              </button>
            </div>
            <div className="flex flex-col gap-6 w-full px-3">
              <div className="w-full aspect-square rounded-xl flex items-center justify-center bg-[#262833] text-[#7387ff] shadow-inner cursor-default">
                <LayoutTemplate size={24} />
              </div>
            </div>
            <div className="mt-auto w-full px-3">
              <button onClick={handleSettingsClick} className="w-full aspect-square rounded-xl flex items-center justify-center text-slate-500 hover:text-white hover:bg-[#1a1c26] transition-all">
                <Settings size={22} />
              </button>
            </div>
          </nav>

          {/* 🌟 [UI 포인트 2, 4] 카드형 레이아웃 및 하단 고정 CTA */}
          {isSidebarOpen && (
            <aside className="w-[320px] bg-[#12141c] border-r border-[#262833] flex flex-col h-full z-10 animate-in slide-in-from-left-4 shrink-0 relative">
              <div className="p-6 pb-4 flex flex-col gap-1">
                <h1 className="text-lg font-black text-white tracking-tight flex items-center gap-2">
                  Campaign Settings
                </h1>
              </div>
              
              {/* 🌟 [UI 포인트 1] 인라인 프로그레스 바 (사이드바 상단 고정) */}
              {exportState.isExporting && (
                <div className="px-5 pb-3 shrink-0 animate-in fade-in slide-in-from-top-2">
                  <div className="bg-[#1a1c26] border border-[#303340] rounded-xl p-3.5 shadow-lg relative overflow-hidden">
                    <div className="absolute inset-0 opacity-10 progress-stripes pointer-events-none"></div>
                    <div className="flex justify-between items-center text-[11px] font-bold mb-2 relative z-10">
                      <span className="text-white truncate pr-2 flex items-center gap-1.5"><Loader2 size={12} className="animate-spin text-[#7387ff]"/> {exportState.msg}</span>
                      <span className="text-[#7387ff]">{exportState.progress}%</span>
                    </div>
                    <div className="w-full bg-[#0a0812] h-1.5 rounded-full overflow-hidden relative z-10">
                      <div className="h-full bg-gradient-to-r from-[#4f3df6] to-[#7387ff] transition-all duration-300" style={{width: `${exportState.progress}%`}}></div>
                    </div>
                  </div>
                </div>
              )}
              
              <div className="flex-1 overflow-y-auto px-5 pb-32 space-y-4 custom-scrollbar">
                {/* Card 1: Campaign Info */}
                <div className="bg-[#1a1c26] rounded-xl p-5 border border-[#262833] shadow-sm">
                  <h3 className="text-[11px] font-bold text-slate-400 uppercase mb-4 flex items-center gap-1.5"><Layout size={12}/> Campaign Info</h3>
                  <div className="space-y-4">
                    <div><label className="block text-[10px] text-slate-500 mb-1.5">프로젝트명</label><input type="text" name="campaignName" value={campaignMeta.campaignName} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2.5 text-sm text-white focus:border-[#4f3df6] outline-none transition-all" /></div>
                    <div><label className="block text-[10px] text-slate-500 mb-1.5">톤앤매너</label><input type="text" name="toneAndManner" value={campaignMeta.toneAndManner} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2.5 text-sm text-white focus:border-[#4f3df6] outline-none transition-all" /></div>
                  </div>
                </div>

                {/* Card 2: Targeting & Schedule */}
                <div className="bg-[#1a1c26] rounded-xl p-5 border border-[#262833] shadow-sm">
                  <h3 className="text-[11px] font-bold text-slate-400 uppercase mb-4 flex items-center gap-1.5"><Calendar size={12}/> Targeting & Schedule</h3>
                  <div className="space-y-4">
                    <div>
                      <label className="block text-[10px] text-slate-500 mb-1.5">타겟 구분</label>
                      <select name="target" value={campaignMeta.target} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2 text-sm text-white focus:border-[#4f3df6] outline-none transition-all">
                        <option value="MASS">MASS (전체 노출)</option>
                        <option value="TARGET">TARGET (특정 타겟팅)</option>
                      </select>
                    </div>
                    {campaignMeta.target === 'TARGET' && (
                      <div className="animate-in fade-in slide-in-from-top-1"><label className="block text-[10px] text-slate-500 mb-1.5">타겟 수량</label><input type="text" name="targetSize" value={campaignMeta.targetSize || ''} onChange={handleMetaChange} placeholder="예: 50,000명" className="w-full bg-[#0a0812] border border-[#262833] rounded-lg p-2 text-sm text-white focus:border-[#4f3df6] outline-none transition-all" /></div>
                    )}
                    <div className="pt-2 border-t border-[#262833]">
                      <div className="grid grid-cols-2 gap-2 mb-2">
                        <div><label className="block text-[9px] text-slate-500 mb-1">시작일</label><input type="date" name="startDate" value={campaignMeta.startDate} onChange={handleMetaChange} className="w-full bg-[#0a0812] rounded p-1.5 text-xs text-slate-300 outline-none border border-[#262833] [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" /></div>
                        <div><label className="block text-[9px] text-slate-500 mb-1">종료일</label><input type="date" name="dueDate" value={campaignMeta.dueDate} onChange={handleMetaChange} className="w-full bg-[#0a0812] rounded p-1.5 text-xs text-slate-300 outline-none border border-[#262833] [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" /></div>
                      </div>
                      <button onClick={applyDatesToAll} className="w-full py-1.5 bg-[#262833] hover:bg-[#303340] rounded-md text-[10px] font-bold text-slate-400 hover:text-white transition-colors">전체 배너에 일정 일괄 적용</button>
                    </div>
                  </div>
                </div>
              </div>

              {/* 🌟 [UI 포인트 4] Fixed CTA (하단 고정 버튼) */}
              <div className="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-[#12141c] via-[#12141c] to-transparent pt-10 border-t border-[#262833]">
                <button onClick={handleExport} disabled={exportState.isExporting} className="w-full bg-[#4f3df6] hover:bg-[#6252ff] disabled:bg-[#303340] disabled:text-slate-500 text-white py-3.5 rounded-xl text-sm font-bold flex items-center justify-center gap-2 shadow-[0_4px_20px_rgba(79,61,246,0.4)] transition-all">
                  <Send size={16} /> Publish to Jira <span className="bg-black/20 px-2 py-0.5 rounded text-xs ml-1 font-mono">{assets.length}</span>
                </button>
              </div>
            </aside>
          )}

          {/* 메인 렌더링 영역 */}
          <main className="flex-1 flex flex-col min-w-0 bg-[#06070a] relative">
            <header className="px-8 py-5 flex justify-between items-center z-20">
               <h2 className="text-lg font-bold text-white flex items-center gap-2 tracking-tight">
                 Preview Layout <span className="text-[#4f3df6] font-black text-xl">·</span> <span className="text-slate-500 text-sm font-medium">{activeAsset?.name}</span>
               </h2>
               <div className="flex gap-2">
                 <button onClick={() => setIsAddAssetModalOpen(true)} className="flex items-center gap-1.5 px-4 py-2 bg-[#1a1c26] text-white rounded-lg text-xs font-bold border border-[#303340] hover:bg-[#262833] transition-colors"><Plus size={14} className="text-[#7387ff]"/> Add Variant</button>
               </div>
            </header>

            {/* 상단: 폼 + 메인 시뮬레이터 */}
            <div className="flex-1 relative overflow-hidden">
              <BlockRenderer block={activeAsset} onUpdate={handleAssetChange} />
            </div>

            {/* 🌟 [UI 포인트 3] 하단 시안 갤러리 (Variant Gallery) */}
            <div className="h-[220px] bg-[#12141c] border-t border-[#262833] shrink-0 flex flex-col z-20 shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
              <div className="flex px-6 py-3 justify-between items-center border-b border-[#262833] bg-[#0f111a]">
                <h3 className="text-xs font-bold text-slate-400">Variant Assets ({assets.length})</h3>
                <span className="text-[10px] text-slate-600 font-mono">Shift + Scroll to navigate</span>
              </div>
              
              <div className="flex-1 overflow-x-auto custom-scrollbar flex items-center gap-4 px-6 py-4 bg-[#0a0812]">
                {assets.map((asset, idx) => (
                  <div 
                    key={asset.id} 
                    className={`relative w-[220px] h-full rounded-xl border-2 transition-all shrink-0 flex flex-col overflow-hidden group cursor-pointer ${activeTabId === asset.id ? 'border-[#4f3df6] bg-[#1a1c26] shadow-[0_0_15px_rgba(79,61,246,0.3)]' : 'border-[#262833] bg-[#12141c] hover:border-[#4f3df6]/50'}`}
                    onClick={() => setActiveTabId(asset.id)}
                  >
                    {/* 미니 아이콘 배경 */}
                    <div className="h-[65%] flex items-center justify-center bg-[#06070a] border-b border-[#262833] relative overflow-hidden">
                      <div className="absolute inset-0 flex items-center justify-center text-slate-800 scale-[2.5] opacity-20"><LayoutTemplate size={64}/></div>
                      <div className="relative z-10 flex flex-col items-center text-slate-500">
                        {getAssetIcon(asset.type)}
                        <span className="text-[10px] font-bold mt-2 font-mono">{asset.type.split('_')[0]}</span>
                      </div>
                    </div>
                    {/* 텍스트 및 선택 버튼 영역 */}
                    <div className="h-[35%] p-3 flex justify-between items-center relative bg-[#12141c] group-hover:bg-[#1a1c26] transition-colors">
                      <div className="flex flex-col truncate pr-2">
                        <span className="text-xs font-bold text-white truncate">{asset.name}</span>
                        <span className="text-[9px] text-[#7387ff] font-bold mt-0.5">Variant {String.fromCharCode(65 + idx)}</span>
                      </div>
                      
                      {activeTabId === asset.id ? (
                        <div className="px-2.5 py-1 bg-[#4f3df6] text-white rounded text-[10px] font-bold shrink-0">Selected</div>
                      ) : (
                        <div className="px-2.5 py-1 bg-[#262833] text-slate-400 rounded text-[10px] font-bold shrink-0 group-hover:bg-[#4f3df6] group-hover:text-white transition-colors">Select</div>
                      )}
                      
                      {assets.length > 1 && (
                        <button onClick={(e) => removeAsset(asset.id, e)} className="absolute top-2.5 right-2 opacity-0 group-hover:opacity-100 p-1 hover:text-red-400 bg-[#0a0812]/80 backdrop-blur rounded-full transition-all text-slate-400">
                          <Trash2 size={12}/>
                        </button>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </main>

          {/* 모달 창 */}
          {isAddAssetModalOpen && (
            <div className="fixed inset-0 bg-[#0a0812]/95 backdrop-blur-md z-50 flex items-center justify-center p-4 animate-in zoom-in-95 duration-200">
              <div className="bg-[#12141c] w-[900px] border border-[#262833] rounded-3xl shadow-2xl flex flex-col overflow-hidden ring-1 ring-white/10">
                <div className="p-6 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                  <h3 className="text-xl font-black text-white flex items-center gap-2"><LayoutTemplate size={22} className="text-[#4f3df6]"/> Select Template</h3>
                  <button onClick={() => setIsAddAssetModalOpen(false)} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={20}/></button>
                </div>
                <div className="p-8 grid grid-cols-2 lg:grid-cols-3 gap-5 max-h-[70vh] overflow-y-auto custom-scrollbar bg-[#0a0812]">
                  {BANNER_SPECS.map((spec) => (
                    <div key={spec.type} onClick={() => addAsset(spec.type, spec.name)} className="bg-[#1a1c26] border border-[#262833] rounded-2xl p-6 cursor-pointer hover:border-[#4f3df6] hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(79,61,246,0.2)] transition-all flex flex-col h-full group">
                      <div className="flex items-start justify-between mb-4"><div className="p-3 bg-[#0a0812] border border-[#303340] rounded-xl text-[#7387ff] group-hover:bg-[#4f3df6] group-hover:border-[#4f3df6] group-hover:text-white transition-colors"><spec.icon size={24} /></div><span className="text-[10px] font-bold bg-[#0a0812] border border-[#303340] text-slate-400 px-2 py-1 rounded-md font-mono">{spec.ratio}</span></div>
                      <h4 className="text-lg font-bold text-white mb-1 group-hover:text-[#7387ff] transition-colors">{spec.name}</h4>
                      <p className="text-xs text-slate-500 leading-relaxed mt-auto pt-4 border-t border-[#262833]">{spec.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    } 

    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
