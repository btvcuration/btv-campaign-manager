    .progress-stripes { background-image: linear-gradient(45deg, rgba(255, 255, 255, 0.15) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.15) 50%, rgba(255, 255, 255, 0.15) 75%, transparent 75%, transparent); background-size: 1rem 1rem; animation: progress-stripes 1s linear infinite; }
    @keyframes progress-stripes { from { background-position: 1rem 0; } to { background-position: 0 0; } }

<body>
  <div id="root"></div>

  <script type="text/babel" data-type="module">
    import React, { useState, useRef, useEffect } from 'react';
    import { createRoot } from 'react-dom/client';
    
    import { 
      Tv, LayoutTemplate, Send, ChevronRight, ChevronDown, ChevronUp, Copy, CheckCircle, 
      Search, Mic, Menu, Home, Grid, Settings, Calendar, GitMerge, Plus, PlusCircle, Trash2, 
      Image as ImageIcon, ListTodo, Smartphone, LayoutPanelLeft, MonitorPlay, Sparkles, Bot, 
      X, User, ExternalLink, Monitor, Layout, Type, RectangleHorizontal, FileText, CalendarDays, MessageSquare, Loader2, Lock, Users, Download, RefreshCw, Inbox, FolderOpen, PanelLeftOpen, PanelLeftClose
    } from 'lucide-react';
    
    // 🌟 [신규 추가] 3단 유저플로우 시뮬레이터 렌더링용 컴포넌트
    const MermaidViewer = ({ code }) => {
      const containerRef = useRef(null);
      useEffect(() => {
        if (code && containerRef.current && window.mermaid) {
          containerRef.current.innerHTML = ''; 
          window.mermaid.initialize({ startOnLoad: false, theme: 'dark', securityLevel: 'loose' });
          window.mermaid.render(`mermaid-${Date.now()}`, code).then(({svg}) => {
            if(containerRef.current) containerRef.current.innerHTML = svg;
          }).catch(e => console.error("Mermaid Render Error:", e));
        }
      }, [code]);
      
      if (!code) return null;
      return <div ref={containerRef} className="w-full flex justify-center items-center overflow-auto custom-scrollbar p-4" />;
    };

    const GNB_OPTIONS = ['홈', 'Btv+', '영화시리즈', 'TV 방송', '무료', '애니메이션', '해피시니어', '키즈', 'OTT홈', '실시간 채널', '광고 홈', '콘텐츠', '기타'];

    const TEMPLATE_URLS = {
      'TODAY_BTV': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/today_btv.png',
      'GENERAL_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png',
      'GENERAL_SET_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/general_banner_2col.png',
      'FULL_PROMO_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/full_promo.png',
      'BIG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/big_banner.png',
      'LONG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/long_banner.png',
      'STRIP_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/strip_banner.png',
      'SYNOPSIS_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/synopsis_banner.png',
      'PROMO_POPUP': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/promo_popup.png',
      'MINI_EPG_BANNER': 'https://raw.githubusercontent.com/btvcuration/campaign/main/assets/images/ui-templates/mini_epg.png'
    };

    const BANNER_SPECS = [
      { type: 'TODAY_BTV', name: 'Today B tv', icon: MonitorPlay, ratio: '16:9', desc: '홈 최상단 대형 배너. 75% 이미지 배치.' },
      { type: 'GENERAL_BANNER', name: '일반 배너', icon: LayoutPanelLeft, ratio: '가변', desc: '배경 프리뷰와 하단 배너 카드 1개 세팅.' },
      { type: 'GENERAL_SET_BANNER', name: '일반 배너 (세트형)', icon: Grid, ratio: '가변', desc: '연속된 2/3단 패키지 배너 세팅 및 통합 기획.' },
      { type: 'FULL_PROMO_BANNER', name: '풀프로모션', icon: LayoutTemplate, ratio: '16:9', desc: '공통 배경 위에 메인 카피와 3개 카드 세트.' },
      { type: 'BIG_BANNER', name: '빅배너', icon: Monitor, ratio: '24.5:8.3', desc: '텍스트와 우측 이미지로 구성된 대형 영역.' },
      { type: 'LONG_BANNER', name: '롱배너', icon: Smartphone, ratio: '129:181', desc: '세로형 긴 배너. 카피 가독성 중요.' },
      { type: 'STRIP_BANNER', name: '띠배너', icon: RectangleHorizontal, ratio: '가변', desc: '콘텐츠 사이 삽입되는 가로형 긴 띠배너.' },
      { type: 'SYNOPSIS_BANNER', name: '시놉시스 배너', icon: RectangleHorizontal, ratio: '가변', desc: '시놉시스 화면에 노출되는 쿠폰/할인 띠배너.' },
      { type: 'PROMO_POPUP', name: 'TV 팝업', icon: Sparkles, ratio: '4:3', desc: '중앙 팝업 공지. 이미지와 하단 액션 버튼.' },
      { type: 'MINI_EPG_BANNER', name: '미니 EPG 배너', icon: Tv, ratio: '가변', desc: '실시간 방송 시청 중 노출되는 썸네일.' }
    ];

    const DEFAULT_MINI_EPG_BANNER = { imageUrl: '', buttonText: '감상하기', landingValue: 'UI_PATH: /join', gnb: '실시간 채널', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_TODAY_BTV = { topText: '상단 문구', mainTitle: '메인 문구', subText: '서브 텍스트', landingValue: 'UI_PATH: /join', buttonText: '자세히 보기', imageUrl: '', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_GENERAL_BANNER = { colType: '2단', previewTitle: '배경 좌상단 텍스트 (1줄)', previewSub: '서브 설명글 영역', previewImg: '', bannerCopy: '배너 내 텍스트', bannerImg: '', landingValue: 'UI_PATH: /join', gnb: '영화시리즈', note: '', memos: [], startDate: '', dueDate: '' };
    // 🌟 신규 세트 배너 초기값 (배열 형태)
    const DEFAULT_GENERAL_SET_BANNER = { 
      colType: '3단', 
      selectedCardIndex: 0,
      cards: [
        { heroTitle: '세트 1 좌상단 타이틀', heroSub: '세트 1에 대한 서브 설명글', heroImg: '', cardCopy: '카드 1 타이틀', cardImg: '', landingValue: 'UI_PATH: /set1' },
        { heroTitle: '세트 2 좌상단 타이틀', heroSub: '세트 2에 대한 서브 설명글', heroImg: '', cardCopy: '카드 2 타이틀', cardImg: '', landingValue: 'UI_PATH: /set2' },
        { heroTitle: '세트 3 좌상단 타이틀', heroSub: '세트 3에 대한 서브 설명글', heroImg: '', cardCopy: '카드 3 타이틀', cardImg: '', landingValue: 'UI_PATH: /set3' }
      ], 
      gnb: '영화시리즈', note: '', memos: [], startDate: '', dueDate: '' 
    };
    const DEFAULT_FULL_PROMO_BANNER = { bgImg: '', topLogo: '상단 타이틀', mainCopy: '메인 하이라이트 문구', subCopy: '서브 텍스트 라인', card1Title: '블룸 하우스', card1Sub: '카드 1 설명', card1Img: '', card1Landing: '', card2Title: '블룸 하우스', card2Sub: '카드 2 설명', card2Img: '', card2Landing: '', card3Title: '블룸 하우스', card3Sub: '카드 3 설명', card3Img: '', card3Landing: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_BIG_BANNER = { subType: '기본형', mainTitle: '메인 문구', subTitle: '서브 타이틀', desc: '상세 설명글을 입력해주세요.', buttonText: '바로가기', imageUrl: '', logoImg: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_LONG_BANNER = { copy: '세로형 배너 메인 카피', subTitle: '서브 카피 입력', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_STRIP_BANNER = { mainTitle: '메인 이벤트 타이틀', subTitle: '서브 프로모션 텍스트', imageUrl: '', landingValue: 'UI_PATH: /join', gnb: '이벤트', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_SYNOPSIS_BANNER = { mainTitle: '2,000명 추첨 증정', subTitle: '~7.20 | 다음날 발급', imageUrl: '', badgeText: '영화 쿠폰\n3,300원', landingValue: 'UI_PATH: /join', gnb: '콘텐츠', note: '', memos: [], startDate: '', dueDate: '' };
    const DEFAULT_PROMO_POPUP = { imageUrl: '', buttonText: '바로가기', closeText: '닫기', landingValue: 'UI_PATH: /join', gnb: '홈', note: '', memos: [], startDate: '', dueDate: '' };

    const DraggableMemo = ({ memo, updateMemo, removeMemo }) => {
      const [pos, setPos] = useState({ x: memo.x || 50, y: memo.y || 50 });
      const isDragging = useRef(false);
      const dragStart = useRef({ mouseX: 0, mouseY: 0, boxX: 0, boxY: 0 });

      useEffect(() => { setPos({ x: memo.x || 50, y: memo.y || 50 }); }, [memo.x, memo.y]);

      const handleMouseDown = (e) => {
        if (e.target.tagName === 'TEXTAREA' || e.target.closest('button')) return;
        
        e.preventDefault(); e.stopPropagation();
        isDragging.current = true;
        dragStart.current = { mouseX: e.clientX, mouseY: e.clientY, boxX: pos.x, boxY: pos.y };

        const handleMouseMove = (ev) => {
          if (!isDragging.current) return;
          ev.preventDefault();
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          setPos({ x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
        };

        const handleMouseUp = (ev) => {
          if (!isDragging.current) return;
          isDragging.current = false;
          const dx = ev.clientX - dragStart.current.mouseX;
          const dy = ev.clientY - dragStart.current.mouseY;
          updateMemo(memo.id, { x: dragStart.current.boxX + dx, y: dragStart.current.boxY + dy });
          
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };

        document.addEventListener('mousemove', handleMouseMove, { passive: false });
        document.addEventListener('mouseup', handleMouseUp);
      };

      return (
        <div 
          onMouseDown={handleMouseDown}
          className="absolute bg-yellow-300/95 backdrop-blur-sm px-4 py-3 rounded-xl shadow-2xl border border-yellow-400 min-w-[200px] max-w-[300px] transition-shadow hover:shadow-[0_0_20px_rgba(250,204,21,0.6)] cursor-move z-50 pointer-events-auto"
          style={{ transform: `translate3d(${pos.x}px, ${pos.y}px, 0)`, left: 0, top: 0, willChange: 'transform' }}
        >
          <div className="flex items-center justify-between gap-4 mb-2 pointer-events-none">
            <div className="flex items-center gap-1.5 text-yellow-800 font-bold text-[10px]"><MessageSquare size={12}/> 시안 메모</div>
            <button onMouseDown={(e) => e.stopPropagation()} onClick={() => removeMemo(memo.id)} className="pointer-events-auto text-yellow-700 hover:text-red-600 hover:bg-yellow-400 p-1 rounded-full transition-colors"><X size={12}/></button>
          </div>
          <textarea 
            onMouseDown={(e) => e.stopPropagation()}
            value={memo.text} 
            onChange={(e) => updateMemo(memo.id, { text: e.target.value })}
            className="w-full bg-yellow-100/50 border border-yellow-400/30 rounded p-2 text-xs text-yellow-900 font-bold outline-none resize-none focus:bg-white focus:ring-1 focus:ring-yellow-500 custom-scrollbar h-[60px] cursor-text pointer-events-auto"
            placeholder="여기에 메모를 입력하세요..."
          />
        </div>
      );
    };

    const OverlayMemos = ({ block, onUpdate }) => {
      const memos = block.data?.memos || [];
      if (memos.length === 0) return null;

      const updateMemo = (id, updates) => {
        const updatedMemos = memos.map(m => m.id === id ? { ...m, ...updates } : m);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      const removeMemo = (id) => {
        const updatedMemos = memos.filter(m => m.id !== id);
        onUpdate(block.id, 'memos', updatedMemos);
      };

      return (
        <div className="absolute inset-0 pointer-events-none z-50 overflow-visible">
          {memos.map(memo => (
            <DraggableMemo key={memo.id} memo={memo} updateMemo={updateMemo} removeMemo={removeMemo} />
          ))}
        </div>
      );
    };

    // 🌟 수정된 PreviewDisplay: onUpdate를 전달받아 상태 변경 가능하게 함
    // 🌟 수정된 PreviewDisplay: Error #60 방지를 위한 렌더 트리 최적화
    const PreviewDisplay = ({ block, onUpdate }) => {
      if (!block) return null;
      const checkIsUrl = (str) => Boolean(str && typeof str === 'string' && str.startsWith('http'));
      const checkHasText = (str) => Boolean(str && !checkIsUrl(str) && str.trim() !== '');

      const FallbackText = ({ text, alignClass = 'justify-center items-center text-center px-4' }) => {
        if (!checkHasText(text) || checkIsUrl(text)) return null;
        return (
          <div className={`absolute inset-0 flex flex-col sm:flex-row gap-2 ${alignClass} text-white font-black select-none drop-shadow-[0_4px_4px_rgba(0,0,0,0.9)] z-20`}>
            <div className="flex items-center text-white/90 shrink-0 bg-black/20 px-2 py-1 rounded-lg backdrop-blur-sm"><ImageIcon size={22} className="mr-1.5 opacity-90" /><span className="text-sm font-bold tracking-tight">요청 이미지</span></div>
            <span className="text-xl sm:text-2xl truncate leading-tight">{text}</span>
          </div>
        );
      };

      if (block.type === 'TODAY_BTV') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0">
            <div className="absolute inset-0 bg-[#0a0a0f]"></div>
            
            <div className="absolute right-[0%] top-[0%] w-[70%] h-[70%] bg-no-repeat bg-cover bg-right-top z-0" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
              {!checkIsUrl(block.data?.imageUrl) && !checkHasText(block.data?.imageUrl) && <div className="absolute inset-0 bg-gradient-to-bl from-[#1e1b4b] to-[#0a0a0f] opacity-50"></div>}
              <FallbackText text={block.data?.imageUrl} alignClass="justify-end items-start pt-10 pr-10" />
              <div className="absolute inset-0 bg-gradient-to-r from-[#0a0a0f] via-transparent to-transparent w-[35%]"></div>
              <div className="absolute inset-0 bg-gradient-to-t from-[#0a0a0f] via-transparent to-transparent h-[35%] top-auto bottom-0"></div>
            </div>
            
            <div className="absolute inset-0 w-[50%] bg-gradient-to-r from-[#0a0a0f] via-[#0a0a0f]/95 to-transparent z-10 pointer-events-none"></div>
            <div className="absolute inset-0 top-[40%] bg-gradient-to-t from-[#0a0a0f] via-[#0a0a0f]/90 to-transparent z-10 pointer-events-none"></div>
            
            <div className="absolute inset-0 z-20 flex flex-col pointer-events-none text-white px-10">
              <div className="absolute left-[80px] top-[48%] -translate-y-1/2 w-[45%] pl-2">
                <h3 className="text-[#32d782] text-sm font-bold mb-2 tracking-tight">{block.data?.topText || '상단 카피'}</h3>
                <h1 className="text-white text-4xl font-black mb-3 leading-[1.15] whitespace-pre-wrap tracking-tighter drop-shadow-lg">{block.data?.mainTitle || '타이틀 입력'}</h1>
                <p className="text-slate-200 text-sm font-medium leading-[1.6] drop-shadow-md whitespace-pre-wrap">{block.data?.subText || '서브 텍스트'}</p>
                <div className="mt-5 inline-flex bg-[#4631e6] text-white px-6 py-2.5 rounded font-bold text-sm shadow-xl">자세히 보기</div>
              </div>
              <div className="absolute bottom-10 left-[80px] right-0 flex gap-3 overflow-hidden">
                {[1,2,3,4,5,6,7].map(i => (
                  <div key={i} className="w-[14%] aspect-[14/9] bg-[#222530] rounded-md border border-white/5 shadow-lg shrink-0"></div>
                ))}
              </div>
            </div>
          </div>
        );
      }
      
      if (block.type === 'FULL_PROMO_BANNER') {
        return (
          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0">
            <div className="absolute inset-0 bg-cover bg-center bg-no-repeat z-0" style={{backgroundImage: checkIsUrl(block.data?.bgImg) ? `url(${block.data.bgImg})` : 'none'}}>
              {!checkIsUrl(block.data?.bgImg) && !checkHasText(block.data?.bgImg) && <div className="absolute inset-0 bg-gradient-to-br from-[#1e1b4b] to-[#0a0a0f]"></div>}
              {/* 🌟 Error #60 수정: 형제 요소를 명확히 분리 */}
              <FallbackText text={block.data?.bgImg} />
            </div>
            <div className="absolute inset-0 bg-black/50 backdrop-blur-[2px] z-0 pointer-events-none"></div>
            
            <div className="relative z-10 flex flex-col items-center pt-[8%] px-10 gap-4">
              <h2 className="text-white text-[1.8rem] font-black drop-shadow-lg">{block.data?.topLogo || '상단 타이틀'}</h2>
              <div className="w-[10%] h-0.5 bg-white/50 rounded-full mb-2"></div>
              {block.data?.mainCopy && <div className="text-cyan-300 px-6 py-1.5 text-2xl font-black leading-snug whitespace-pre-wrap text-center max-w-[85%] drop-shadow-xl">{block.data.mainCopy}</div>}
              {block.data?.subCopy && <div className="text-purple-300 px-5 py-1 text-sm font-bold leading-snug whitespace-pre-wrap text-center max-w-[80%] drop-shadow-md">{block.data.subCopy}</div>}
            </div>
            <div className="absolute bottom-[8%] left-[5%] right-[5%] flex justify-center gap-6 z-10 h-[40%]">
              {[1,2,3].map(i => (
                <div key={i} className="flex-1 bg-[#0a0812]/90 border border-white/10 rounded-xl flex flex-col overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.8)] ring-1 ring-white/5">

          <div className="relative w-full aspect-[16/9] bg-[#0a0a0f] overflow-hidden shrink-0 flex items-center justify-center">
            <div className="absolute inset-0 p-12 flex justify-center gap-4 z-0 bg-[#0a0a0f]">
              <div className="h-[90%] aspect-[129/181.5] bg-[#1a1c26] rounded-xl overflow-hidden relative shadow-[0_10px_30px_rgba(0,0,0,0.8)] border-[3px] border-[#7387FF] shrink-0">
                <div className="absolute inset-0 bg-cover bg-top bg-no-repeat z-10" style={{ backgroundImage: checkIsUrl(block.data?.imageUrl) ? `url(${block.data.imageUrl})` : 'none' }}>
                  {!checkIsUrl(block.data?.imageUrl) && !checkHasText(block.data?.imageUrl) && <div className="absolute inset-0 flex items-center justify-center bg-[#0a0a0f]"><ImageIcon size={48} className="text-white/10"/></div>}
                  <FallbackText text={block.data?.imageUrl} alignClass="justify-center items-center text-center px-4" />
                </div>
                <div className="absolute bottom-0 inset-x-0 p-6 bg-gradient-to-t from-black via-black/80 to-transparent z-20 text-center flex flex-col justify-end h-[40%]">
                  <p className="text-white font-extrabold text-xl leading-tight drop-shadow-md whitespace-pre-wrap">{block.data?.copy || '메인 카피 입력'}</p>
                  {block.data?.subTitle && <p className="text-slate-300 font-medium text-xs mt-2 whitespace-pre-wrap">{block.data.subTitle}</p>}
                </div>
              </div>
              {[1, 2].map(i => (
                <div key={i} className="h-[90%] aspect-[129/181.5] bg-[#222530] rounded-xl border border-white/5 shadow-lg shrink-0 flex items-center justify-center relative overflow-hidden">
                   <ImageIcon size={48} className="text-white/5" />
                </div>
              ))}
            </div>
          </div>
        );
      }
    };
    
    // ====================================================================================
    // 🌟 [최종 개편] AI 프로모션 기획 뷰 (폼 확장, 팝업 제어, 머메이드 렌더링)
    // ====================================================================================
    const AiPlannerView = ({ campaignMeta, setCampaignMeta, chatHistory, setChatHistory, mermaidCode, onMoveToEditor }) => {
      const [inputValue, setInputValue] = useState('');
      const [isLoading, setIsLoading] = useState(false);
      const [pendingAiPayload, setPendingAiPayload] = useState(null); 
      const chatEndRef = useRef(null);

      const handleMetaChange = (e) => {
        setCampaignMeta(prev => ({ ...prev, [e.target.name]: e.target.value }));
      };

      useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [chatHistory, isLoading]);

      const handleSendMessage = async () => {
        if (!inputValue.trim()) return;
        const userMessage = inputValue.trim();
        setInputValue('');
        
        const newHistory = [...chatHistory, { id: `msg-${Date.now()}`, sender: 'user', text: userMessage }];
        setChatHistory(newHistory);
        setIsLoading(true);

        try {
          const proxyUrl = "https://btv-proxy.alcheminos.workers.dev";
          const cleanHistory = newHistory.map(msg => ({
            sender: msg.sender,
            text: msg.text.replace(/```json[\s\S]*?```/g, '\n[JSON 처리 완료]\n')
          }));

          const response = await fetch(proxyUrl, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'chatWithGemini', history: cleanHistory, currentState: campaignMeta })
          });

          if (!response.ok) throw new Error("서버 통신에 실패했습니다.");
          const resData = await response.json();
          if (resData.status !== 'success') throw new Error(resData.message || "알 수 없는 에러");

          let displayAiText = resData.text;
          const collectedMatch = displayAiText.match(/\*\*\[현재까지 수집된 정보\]\*\*[\s\S]*?(?=\n\n|$)/);
          if (collectedMatch) displayAiText = displayAiText.replace(collectedMatch[0], '').trim();

          // 화면에 출력되는 머메이드 코드 제거
          const mermaidRegex = /```(?:mermaid)?\s*(graph TD|flowchart TD)[\s\S]*?```/;
          const mMatch = displayAiText.match(mermaidRegex);
          if (mMatch) displayAiText = displayAiText.replace(mMatch[0], '').trim();

          const jsonRegex = /```json\n([\s\S]*?)```/g;
          let match;
          while ((match = jsonRegex.exec(resData.text)) !== null) {
            try {
              const parsedJson = JSON.parse(match[1]);
              if (parsedJson.action === "UPDATE_STATE" && parsedJson.data) {
                const d = parsedJson.data;
                // AI가 옛날 Key값으로 보내도 유연하게 수용, 배열은 텍스트로 변환
                if (!d.conceptCopy && (d.concept || d.mainCopy || d.keyConcept)) d.conceptCopy = d.concept || d.mainCopy || d.keyConcept;
                if (Array.isArray(d.bannerTypes)) d.bannerTypes = d.bannerTypes.join(', ');
                if (Array.isArray(d.gnbLocations)) d.gnbLocations = d.gnbLocations.join(', ');
                
                setCampaignMeta(prev => ({ ...prev, ...d }));
              } 
              else if (parsedJson.action === "CREATE_CAMPAIGN_ASSETS") {
                // 🌟 임시 저장소(대기열)에만 두고 화면 전환은 안 함
                setPendingAiPayload(parsedJson);
                displayAiText = "매니저님, 우측 **'비주얼 유저플로우 시뮬레이터'**에 플로우차트가 렌더링되었습니다! 확인해 보시고, 마음에 드신다면 하단의 **[완성된 기획안으로 시안 편집 이동]** 버튼을 눌러 디자인 작업을 시작해 주세요.";
              }
              displayAiText = displayAiText.replace(match[0], '').trim();
            } catch (e) { console.error("JSON 파싱 에러", e); }
          }

          if (!displayAiText) displayAiText = "우측 기획 정보가 업데이트되었습니다!";
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: displayAiText }]);

        } catch (error) {
          setChatHistory(prev => [...prev, { id: `msg-${Date.now()}`, sender: 'ai', text: "🚨 통신 에러 발생: " + error.message }]);
        } finally {
          setIsLoading(false);
        }
      };

      const handleKeyDown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSendMessage(); } };

      // 우측 시뮬레이터에 그릴 머메이드 코드 (대기열 우선)
      const displayMermaid = pendingAiPayload?.mermaidCode || pendingAiPayload?.rawGasData?.mermaidCode || mermaidCode;

      return (
        <div className="flex h-full w-full bg-[#06070a] overflow-hidden p-6 gap-6">
          {/* 1단: 좌측 챗봇 (33%) */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[320px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-7 h-7 rounded-full bg-[#4f3df6]/20 flex items-center justify-center"><Bot size={16} className="text-[#7387ff]" /></div>
                <h2 className="text-white font-bold text-[15px] tracking-tight">AI 오케스트레이터</h2>
              </div>
            </div>
            
            <div className="flex-1 overflow-y-auto p-5 space-y-6 custom-scrollbar">
              {chatHistory.map((msg) => (
                <div key={msg.id} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                  {msg.sender === 'ai' && <div className="w-7 h-7 rounded-full bg-[#262833] flex items-center justify-center mr-2 shrink-0"><Bot size={14} className="text-slate-300" /></div>}
                  {msg.sender === 'user' ? (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#4f3df6] text-white rounded-br-none shadow-[0_4px_15px_rgba(79,61,246,0.3)] whitespace-pre-wrap">
                      {msg.text}
                    </div>
                  ) : (
                    <div className="max-w-[85%] rounded-2xl px-4 py-2.5 text-[14px] leading-relaxed bg-[#1a1c26] text-slate-200 border border-[#303340] rounded-bl-none shadow-md ai-chat-body" dangerouslySetInnerHTML={{ __html: typeof window.marked !== 'undefined' ? window.marked.parse(msg.text) : msg.text }} />
                  )}
                </div>
              ))}
              {isLoading && (
                <div className="flex justify-start items-center gap-2">
                  <div className="w-7 h-7 rounded-full bg-[#262833] flex items-center justify-center shrink-0"><Bot size={14} className="text-slate-300" /></div>
                  <div className="bg-[#1a1c26] border border-[#303340] rounded-2xl rounded-bl-none px-4 py-3 flex items-center gap-2">
                    <Loader2 size={14} className="text-[#7387ff] animate-spin" />
                    <span className="text-xs text-slate-400 font-medium">폼 동기화 중...</span>
                  </div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>
            <div className="p-3 bg-[#12141c] border-t border-[#262833]">
              <div className="relative flex items-end bg-[#0a0812] border border-[#303340] rounded-xl overflow-hidden focus-within:border-[#4f3df6] transition-colors">
                <textarea value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyDown={handleKeyDown} placeholder="프로모션 목적이나 타겟을 편하게 말씀해 주세요." className="flex-1 max-h-[120px] min-h-[48px] bg-transparent text-white placeholder-slate-500 px-4 py-3 outline-none resize-none custom-scrollbar text-xs" rows={1} />
                <button onClick={handleSendMessage} disabled={!inputValue.trim() || isLoading} className="mb-1.5 mr-1.5 p-2 rounded-lg bg-[#4f3df6] text-white hover:bg-[#6252ff] disabled:bg-[#262833] disabled:text-slate-500 transition-colors shrink-0"><Send size={16} /></button>
              </div>
            </div>
          </div>

          {/* 2단: 중앙 기획 폼 (33%) */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[320px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between">
              <h3 className="text-white font-bold text-[15px] tracking-tight flex items-center gap-2"><Settings size={16} className="text-pink-400" /> 캠페인 기획 폼</h3>
              <span className="text-[9px] text-slate-400 bg-[#1a1c26] px-2 py-0.5 rounded border border-[#303340] animate-pulse">AI 실시간 동기화</span>
            </div>
            
            <div className="p-5 overflow-y-auto custom-scrollbar space-y-5 flex-1">
              <div>
                <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">캠페인 / 프로젝트명</label>
                <input type="text" name="campaignName" value={campaignMeta.campaignName || ''} onChange={handleMetaChange} placeholder="자동 채움 또는 직접 입력" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-white focus:border-[#4f3df6] outline-none transition-all" />
              </div>
              <div>
                <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">대상 상품 (VOD / 월정액 등)</label>
                <input type="text" name="product" value={campaignMeta.product || ''} onChange={handleMetaChange} placeholder="예: 악마는 프라다를 입는다 2" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-white focus:border-[#4f3df6] outline-none transition-all" />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">타겟 유형</label>
                  <select name="target" value={campaignMeta.target || ''} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-white focus:border-[#4f3df6] outline-none transition-all">
                    <option value="" disabled>선택</option><option value="MASS">MASS</option><option value="TARGET">TARGET</option>
                  </select>
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">타겟 모수</label>
                  <input type="text" name="targetSize" value={campaignMeta.targetSize || ''} onChange={handleMetaChange} disabled={campaignMeta.target !== 'TARGET'} placeholder="예: 5만명" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-white focus:border-[#4f3df6] outline-none transition-all disabled:opacity-30" />
                  
                  {/* 🌟 타겟 Capa 검증 UI 추가 */}
                  <label className={`flex items-center gap-1.5 mt-2 ml-1 cursor-pointer transition-opacity ${campaignMeta.target === 'TARGET' ? 'opacity-100' : 'opacity-30 pointer-events-none'}`}>
                    <input type="checkbox" checked={campaignMeta.isCapaChecked || false} onChange={(e) => setCampaignMeta(prev => ({...prev, isCapaChecked: e.target.checked}))} className="w-3 h-3 accent-pink-500" />
                    <span className="text-[10px] text-pink-400 font-bold">타겟 Capa 검증 완료</span>
                  </label>
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">시작일</label>
                  <input type="date" name="startDate" value={campaignMeta.startDate || ''} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-[#4f3df6] [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">종료일</label>
                  <input type="date" name="dueDate" value={campaignMeta.dueDate || ''} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-slate-200 outline-none focus:border-[#4f3df6] [&::-webkit-calendar-picker-indicator]:filter [&::-webkit-calendar-picker-indicator]:invert" />
                </div>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">쿠폰 발급 여부</label>
                  <select name="hasCoupon" value={campaignMeta.hasCoupon || ''} onChange={handleMetaChange} className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-white focus:border-[#4f3df6] outline-none transition-all">
                    <option value="" disabled>선택</option><option value="N">미포함 (N)</option><option value="Y">포함 (Y)</option>
                  </select>
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">쿠폰 혜택</label>
                  <input type="text" name="couponBenefit" value={campaignMeta.couponBenefit || ''} onChange={handleMetaChange} disabled={campaignMeta.hasCoupon === 'N'} placeholder="예: 2,000원 할인" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-white focus:border-[#4f3df6] outline-none transition-all disabled:opacity-30" />
                </div>
              </div>

              {/* 🌟 확장 필드: 배너 유형 및 GNB 위치 추가 */}
              <div className="grid grid-cols-2 gap-3 pt-2 border-t border-[#1a1c26]">
                <div className="col-span-2">
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">제작 배너 유형</label>
                  <input type="text" name="bannerTypes" value={campaignMeta.bannerTypes || ''} onChange={handleMetaChange} placeholder="예: 빅배너, 띠배너 (직접 수정 가능)" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none transition-all" />
                </div>
                <div className="col-span-2">
                  <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1">편성 GNB 위치</label>
                  <input type="text" name="gnbLocations" value={campaignMeta.gnbLocations || ''} onChange={handleMetaChange} placeholder="예: 영화시리즈, TV 방송" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2 text-xs text-white focus:border-[#4f3df6] outline-none transition-all" />
                </div>
              </div>

              <div className="pt-2 border-t border-[#1a1c26]">
                <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1 flex justify-between">
                  <span>Key 컨셉 & 대표 문구</span>
                </label>
                <textarea name="conceptCopy" value={campaignMeta.conceptCopy || ''} onChange={handleMetaChange} placeholder="프로모션의 핵심 카피나 톤앤매너를 입력하세요." className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-white focus:border-[#4f3df6] outline-none transition-all h-20 resize-none custom-scrollbar" />
              </div>
              <div>
                <label className="block text-[11px] font-bold text-slate-400 mb-1 ml-1 flex items-center gap-1"><ImageIcon size={10}/> 메인 키비주얼 URL</label>
                <input type="text" name="mainImageUrl" value={campaignMeta.mainImageUrl || ''} onChange={handleMetaChange} placeholder="https://... (입력 시 모든 시안에 자동 적용)" className="w-full bg-[#0a0812] border border-[#303340] rounded-lg px-3 py-2.5 text-xs text-[#7387ff] focus:border-[#4f3df6] outline-none transition-all" />
              </div>
            </div>
            
            <div className="p-3 bg-[#12141c] border-t border-[#262833]">
              {/* 🌟 팝업 없이 부모 함수로 데이터만 넘기고 에디터 뷰로 이동시킴 */}
              <button 
                onClick={() => { onMoveToEditor(pendingAiPayload); setPendingAiPayload(null); }} 
                className="w-full flex items-center justify-center gap-1.5 px-4 py-3 bg-gradient-to-r from-[#4f3df6] to-[#7387ff] text-white rounded-lg font-black text-[13px] shadow-[0_0_15px_rgba(79,61,246,0.3)] hover:shadow-[0_0_25px_rgba(79,61,246,0.5)] hover:-translate-y-0.5 transition-all"
              >
                완성된 기획안으로 시안 편집 이동 <ChevronRight size={16} />
              </button>
            </div>
          </div>

          {/* 3단: 우측 머메이드 시뮬레이터 (33%) */}
          <div className="flex-1 flex flex-col bg-[#0f111a] border border-[#262833] rounded-2xl shadow-xl overflow-hidden min-w-[320px]">
            <div className="px-5 py-4 border-b border-[#262833] bg-[#12141c] flex items-center justify-between">
              <h3 className="text-white font-bold text-[15px] tracking-tight flex items-center gap-2"><LayoutTemplate size={16} className="text-cyan-400" /> 비주얼 유저플로우 시뮬레이터</h3>

    };

    // ====================================================================================
    // 🌟 [신규 추가] 프로모션 관리(과거 캠페인 목록 조회/불러오기) 뷰
    // ====================================================================================
    const PromotionListView = ({ onLoadCampaign }) => {
      const [campaigns, setCampaigns] = useState([]);
      const [isLoading, setIsLoading] = useState(true);
      const [error, setError] = useState(null);

      const fetchCampaigns = async () => {
        setIsLoading(true);
        setError(null);
        try {
          // ⚠️ 백엔드(Cloudflare Worker → GAS) 쪽에 action=getCampaigns 라우트가 필요합니다.
          // 응답 형식 가정: [{ id, campaignName, target, targetSize, startDate, dueDate, status, jiraKey, updatedAt, meta, assets }, ...]
          const proxyUrl = "https://btv-proxy.alcheminos.workers.dev?action=getCampaigns";
          const response = await fetch(proxyUrl, { method: 'GET', headers: { 'Content-Type': 'application/json' } });
          if (!response.ok) throw new Error(`서버 응답 오류 (${response.status})`);
          const data = await response.json();
          setCampaigns(Array.isArray(data) ? data : (data?.campaigns || []));
        } catch (err) {
          console.error("캠페인 목록 로드 실패:", err);
          setError("캠페인 목록을 불러오지 못했습니다. (백엔드에 getCampaigns 액션이 아직 준비되지 않았을 수 있어요)");
          setCampaigns([]);
        } finally {
          setIsLoading(false);
        }
      };

      useEffect(() => { fetchCampaigns(); }, []);

      // 🌟 [수정됨] 폼의 신규 확장 필드 및 머메이드 코드까지 완벽 복원
      const handleLoad = (item) => {
        const meta = item.meta || {
          campaignName: item.campaignName, target: item.target, targetSize: item.targetSize,
          startDate: item.startDate, dueDate: item.dueDate, hasCoupon: item.hasCoupon, 
          couponBenefit: item.couponBenefit, conceptCopy: item.conceptCopy, mainImageUrl: item.mainImageUrl,
          product: item.product, bannerTypes: item.bannerTypes, gnbLocations: item.gnbLocations
        };
        // onLoadCampaign에 mermaidCode 전달 추가
        onLoadCampaign(meta, item.assets || [], item.mermaidCode || "");
      };

      const handleDuplicate = (item) => {
        const meta = item.meta || {
          campaignName: `${item.campaignName} (복제본)`, target: item.target, targetSize: item.targetSize,
          startDate: '', dueDate: '', hasCoupon: item.hasCoupon, couponBenefit: item.couponBenefit,
          conceptCopy: item.conceptCopy, mainImageUrl: item.mainImageUrl,
          product: item.product, bannerTypes: item.bannerTypes, gnbLocations: item.gnbLocations
        };
        const duplicatedAssets = (item.assets || []).map((a, idx) => ({ ...a, id: `asset-dup-${Date.now()}-${idx}` }));
        onLoadCampaign(meta, duplicatedAssets, item.mermaidCode || "");
      };

      // 🌟 신규: 오늘 날짜 기준 과거 여부 판별 함수
      const isPastCampaign = (startDateStr) => {
        if (!startDateStr) return false;
        const todayStr = new Date(new Date().getTime() - (new Date().getTimezoneOffset() * 60000)).toISOString().split('T')[0];
        return startDateStr < todayStr;
      };

      return (
        <div className="flex flex-col h-full w-full bg-[#06070a] overflow-hidden p-6 gap-5">
          <div className="flex items-center justify-between shrink-0">
            <div>
              <h2 className="text-white font-black text-xl tracking-tight flex items-center gap-2"><FolderOpen size={22} className="text-[#7387ff]" /> 프로모션 관리</h2>
              <p className="text-slate-500 text-xs font-medium mt-1">과거에 만든 캠페인을 확인하고 불러와 수정할 수 있습니다.</p>
            </div>
            <button onClick={fetchCampaigns} disabled={isLoading} className="flex items-center gap-1.5 px-4 py-2 bg-[#1a1c26] text-slate-300 rounded-lg text-xs font-bold border border-[#303340] hover:bg-[#262833] hover:text-white transition-colors disabled:opacity-50">
              <RefreshCw size={14} className={isLoading ? 'animate-spin' : ''} /> 새로고침
            </button>
          </div>

          <div className="flex-1 min-h-0 bg-[#0f111a] border border-[#262833] rounded-2xl overflow-hidden flex flex-col shadow-xl">
            {isLoading ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-3 text-slate-500">
                <Loader2 size={28} className="animate-spin text-[#7387ff]" />
                <span className="text-sm font-medium">캠페인 목록을 불러오는 중...</span>
              </div>
            ) : error ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-3 text-slate-500 px-8 text-center">
                <Inbox size={32} className="text-slate-700" />
                <span className="text-sm font-medium text-red-400/80">{error}</span>
                <button onClick={fetchCampaigns} className="mt-2 px-4 py-1.5 bg-[#1a1c26] border border-[#303340] rounded-lg text-xs text-slate-300 hover:text-white transition-colors">다시 시도</button>
              </div>
            ) : campaigns.length === 0 ? (
              <div className="flex-1 flex flex-col items-center justify-center gap-2 text-slate-500">
                <Inbox size={32} className="text-slate-700" />
                <span className="text-sm font-medium">등록된 캠페인이 없습니다.</span>
              </div>
            ) : (
              <div className="flex-1 overflow-y-auto custom-scrollbar divide-y divide-[#1a1c26]">
                {campaigns.map((item, idx) => (
                  <div key={item.id || idx} className="flex items-center gap-4 px-6 py-4 hover:bg-[#141620] transition-colors">
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center gap-2 mb-1">
                        <h3 className="text-white font-bold text-sm truncate">{item.campaignName || '이름 없음'}</h3>
                        {item.target === 'TARGET' && <span className="text-[10px] font-bold text-orange-400 bg-orange-400/10 border border-orange-400/30 px-1.5 py-0.5 rounded">TARGET</span>}
                        {item.status && <span className="text-[10px] font-bold text-[#7387ff] bg-[#7387ff]/10 border border-[#7387ff]/30 px-1.5 py-0.5 rounded">{item.status}</span>}
                      </div>
                      <p className="text-slate-500 text-xs font-medium">
                        {item.startDate || '미지정'} ~ {item.dueDate || '미지정'}
                        {item.targetSize ? ` · 모수 ${item.targetSize}` : ''}
                        {item.updatedAt ? ` · 수정 ${item.updatedAt}` : ''}
                      </p>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      {item.jiraKey && (
                        <a href={`https://jira.skbroadband.com/browse/${item.jiraKey}`} target="_blank" rel="noreferrer" className="flex items-center gap-1 px-3 py-1.5 bg-[#1a1c26] text-slate-300 rounded-lg text-xs font-bold border border-[#303340] hover:text-white transition-colors">
                        <ExternalLink size={12} /> Jira</a>
                      )}
                      <div className="flex items-center gap-2 shrink-0">
                        {item.jiraKey && (
                          <a href={`https://jira.skbroadband.com/browse/${item.jiraKey}`} target="_blank" rel="noreferrer" className="flex items-center gap-1 px-3 py-1.5 bg-[#1a1c26] text-slate-300 rounded-lg text-xs font-bold border border-[#303340] hover:text-white transition-colors">
                          <ExternalLink size={12} /> Jira</a>
                        )}
                        
                        {/* 🌟 신규: 복제 버튼 (항상 노출) */}
                        <button onClick={() => handleDuplicate(item)} className="flex items-center gap-1 px-3 py-1.5 bg-[#262833] text-slate-300 rounded-lg text-xs font-bold border border-[#303340] hover:bg-white hover:text-[#111] transition-colors">
                          <Copy size={12} /> 복제
                        </button>
  
                        {/* 🌟 수정: 과거 일정이면 '수정' 버튼 숨김 */}
                        {!isPastCampaign(item.startDate) && (
                          <button onClick={() => handleLoad(item)} className="flex items-center gap-1 px-3 py-1.5 bg-[#4f3df6]/10 text-[#7387ff] rounded-lg text-xs font-bold border border-[#4f3df6]/30 hover:bg-[#4f3df6] hover:text-white transition-colors">
                            수정 <ChevronRight size={12} />
                          </button>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      );
    };

    function App() {
      const [currentView, setCurrentView] = useState('PLANNER');
      const [isSidebarOpen, setIsSidebarOpen] = useState(true);
      const [isNavExpanded, setIsNavExpanded] = useState(false); 
      // 🌟 [수정됨] 설치 여부뿐만 아니라 버전(Version) 정보까지 가져옵니다.
      const [extensionVersion, setExtensionVersion] = useState(null);
      
      useEffect(() => {
        const checkExtension = () => {
          const extNode = document.getElementById('btv-campaign-extension-installed');
          if (extNode) {
            // content.js가 심어둔 data-version 속성을 읽어옵니다. 없으면 기본값 1.0.0
            setExtensionVersion(extNode.getAttribute('data-version') || '1.0.0');
          }
        };
        checkExtension();
        // 페이지 로딩 직후 익스텐션 주입이 미세하게 늦을 경우를 대비해 한 번 더 체크
        setTimeout(checkExtension, 800); 
      }, []);

      const today = new Date();
      const todayStr = new Date(today.getTime() - (today.getTimezoneOffset() * 60000)).toISOString().split('T')[0];

      // EDITOR 전용 상태
      const [campaignMeta, setCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false
      });
      const [assets, setAssets] = useState([]); 
      const [mermaidCode, setMermaidCode] = useState(''); // 🌟 App 레벨에 머메이드 저장소 추가

      // AI 기획 폼 전용 상태
      const [aiCampaignMeta, setAiCampaignMeta] = useState({ 
        campaignName: '', product: '', target: 'MASS', targetSize: '', startDate: '', dueDate: '',
        hasCoupon: 'N', couponBenefit: '', conceptCopy: '', mainImageUrl: '', bannerTypes: '', gnbLocations: '', isCapaChecked: false
      });
      const [aiChatHistory, setAiChatHistory] = useState([
        { id: 'msg-init', sender: 'ai', text: '매니저님, 환영합니다.\n어떤 프로모션을 기획하실 예정인가요? 우측 폼에 아시는 만큼 먼저 적어주셔도 좋고, 저와 대화하며 하나씩 채워가도 좋습니다!' }
      ]);

      const [exportState, setExportState] = useState({ isExporting: false, progress: 0, msg: '' });
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [openAccordions, setOpenAccordions] = useState({ campaign: true, banner: true });

      const handleSettingsClick = () => setIsSettingsOpen(true);
      const handleConfigChange = (gnbName, field, value) => setConfigMap(prev => ({ ...prev, [gnbName]: { ...prev[gnbName], [field]: value } }));
      const handleSaveConfig = async () => { setIsSettingsOpen(false); };

      // 🌟 [핵심] AI 뷰에서 매니저님이 명시적으로 '시안 편집 이동'을 눌렀을 때만 작동!
      const handleMoveToEditor = (payload) => {
        // 1. 매니저님이 직접 수정한 AI 기획 폼(aiCampaignMeta)을 에디터 폼(campaignMeta)으로 넘깁니다.
        setCampaignMeta({ ...aiCampaignMeta });

        // 2. 전달된 데이터가 없으면 화면만 쓱 넘깁니다.
        if (!payload || payload.action !== "CREATE_CAMPAIGN_ASSETS") {
          setCurrentView('EDITOR');
          return;
        }
        
        // 3. 기존에 그려진 배너가 있을 때만 덮어쓸지 경고합니다. (버튼 눌렀을 때만 뜸!)
        if (assets.length > 0) {
          const confirmOverwrite = window.confirm("⚠️ 이미 시안 편집 화면에 작업 중인 배너가 존재합니다.\n새로운 AI 기획안으로 덮어씌우시겠습니까?");
          if (!confirmOverwrite) {
            setCurrentView('EDITOR'); // 취소하면 기존 에셋 유지하고 넘어가기만 함
            return; 
          }
        }

        // 4. 승인되었거나 빈 화면이면 AI 에셋을 에디터에 쫙 깔아줍니다.
        const aiMeta = payload.rawGasData?.meta || payload.campaignMeta;
        const aiAssets = payload.rawGasData?.assets || payload.assets;
        const aiMermaid = payload.mermaidCode || payload.rawGasData?.mermaidCode;
        
        if (aiMermaid) setMermaidCode(aiMermaid);
        
        if (aiMeta) {
          if (!aiMeta.conceptCopy && (aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept)) {
             aiMeta.conceptCopy = aiMeta.concept || aiMeta.mainCopy || aiMeta.keyConcept;
          }
          if (Array.isArray(aiMeta.bannerTypes)) aiMeta.bannerTypes = aiMeta.bannerTypes.join(', ');
          if (Array.isArray(aiMeta.gnbLocations)) aiMeta.gnbLocations = aiMeta.gnbLocations.join(', ');
          
          setCampaignMeta(prev => ({ ...prev, ...aiMeta }));
        }

        if (aiAssets && Array.isArray(aiAssets)) {
          if (aiAssets.length === 0) {
            setAssets([]);
            setActiveTabId(null);
          } else {
            const timestamp = Date.now();
            const newAssets = aiAssets.map((aiAsset, index) => {
              let baseData = {};
              if (aiAsset.type === 'TODAY_BTV') baseData = { ...DEFAULT_TODAY_BTV };
              else if (aiAsset.type === 'GENERAL_BANNER') baseData = { ...DEFAULT_GENERAL_BANNER };
              else if (aiAsset.type === 'GENERAL_SET_BANNER') baseData = { ...DEFAULT_GENERAL_SET_BANNER };
              else if (aiAsset.type === 'FULL_PROMO_BANNER') baseData = { ...DEFAULT_FULL_PROMO_BANNER };
              else if (aiAsset.type === 'BIG_BANNER') baseData = { ...DEFAULT_BIG_BANNER };
              else if (aiAsset.type === 'LONG_BANNER') baseData = { ...DEFAULT_LONG_BANNER };
              else if (aiAsset.type === 'STRIP_BANNER') baseData = { ...DEFAULT_STRIP_BANNER };
              else if (aiAsset.type === 'SYNOPSIS_BANNER') baseData = { ...DEFAULT_SYNOPSIS_BANNER };
              else if (aiAsset.type === 'PROMO_POPUP') baseData = { ...DEFAULT_PROMO_POPUP };
              else if (aiAsset.type === 'MINI_EPG_BANNER') baseData = { ...DEFAULT_MINI_EPG_BANNER };

              let rawGnb = aiAsset.data?.gnb || baseData.gnb;
              let gnbArray = Array.isArray(rawGnb) ? rawGnb : [rawGnb];
              let cleanedGnb = gnbArray.map(g => {
                if (g.includes('영화') && g.includes('시리즈')) return '영화시리즈';
                if (g.includes('TV') && g.includes('방송')) return 'TV 방송';
                if (g === 'OTT 홈' || g === 'OTT') return 'OTT홈';
                return g;
              });

              return {
                id: `ai-asset-${index}-${timestamp}`, type: aiAsset.type, name: aiAsset.name || `${aiAsset.type.replace('_', ' ')} (AI)`, 
                data: { ...baseData, ...aiAsset.data, gnb: cleanedGnb, startDate: aiMeta?.startDate || baseData.startDate, dueDate: aiMeta?.dueDate || baseData.dueDate } 
              };
            });

            setAssets(newAssets);
            setActiveTabId(newAssets[0].id); 
          }
        }
        setCurrentView('EDITOR');
      };

      const [activeTabId, setActiveTabId] = useState('asset-1');
      const [isAddAssetModalOpen, setIsAddAssetModalOpen] = useState(false);
      const [localShowSafeZone, setLocalShowSafeZone] = useState(false);
      const [configMap, setConfigMap] = useState({});
      
      useEffect(() => {
        const fetchConfig = async () => {
          try {
            const proxyUrl = "https://btv-proxy.alcheminos.workers.dev?action=getConfig";
            const response = await fetch(proxyUrl, { method: 'GET', headers: { 'Content-Type': 'application/json' } });
            if (!response.ok) throw new Error("네트워크 응답이 올바르지 않습니다.");
            const configData = await response.json();
            setConfigMap(configData);
          } catch (error) {
            console.error("Config 로드 실패:", error);
            setConfigMap({ "영화시리즈": { "name": "담당자 미지정", "jiraId": "system_auto" }, "TV 방송": { "name": "담당자 미지정", "jiraId": "system_auto" } });
          }
        };
        fetchConfig();
      }, []);

      const handleMetaChange = (e) => setCampaignMeta({ ...campaignMeta, [e.target.name]: e.target.value });
      
      const handleAssetChange = (id, field, value) => {
        setAssets(prevAssets => prevAssets.map(asset => asset.id === id ? { ...asset, data: { ...asset.data, [field]: value } } : asset));
      };
      
      const handleCardChange = (id, cardIndex, field, value) => {
        setAssets(prevAssets => prevAssets.map(asset => {
          if (asset.id !== id) return asset;
          const newCards = [...(asset.data.cards || [])];
          newCards[cardIndex] = { ...newCards[cardIndex], [field]: value };
          return { ...asset, data: { ...asset.data, cards: newCards } };
        }));
      };

      const handleAddMemo = () => {
        const currentMemos = activeAsset.data?.memos || [];
        const offset = currentMemos.length * 20; 
        const newMemo = { id: `memo-${Date.now()}`, text: '', x: 50 + offset, y: 50 + offset };
        handleAssetChange(activeAsset.id, 'memos', [...currentMemos, newMemo]);
      };

      const addAsset = (type, name) => {
        const newId = `asset-${Date.now()}`;
        let newData = {};
        if (type === 'TODAY_BTV') newData = { ...DEFAULT_TODAY_BTV };
        else if (type === 'GENERAL_BANNER') newData = { ...DEFAULT_GENERAL_BANNER };
        else if (type === 'GENERAL_SET_BANNER') newData = { ...DEFAULT_GENERAL_SET_BANNER };
        else if (type === 'FULL_PROMO_BANNER') newData = { ...DEFAULT_FULL_PROMO_BANNER };
        else if (type === 'BIG_BANNER') newData = { ...DEFAULT_BIG_BANNER };
        else if (type === 'LONG_BANNER') newData = { ...DEFAULT_LONG_BANNER };
        else if (type === 'STRIP_BANNER') newData = { ...DEFAULT_STRIP_BANNER };
        else if (type === 'SYNOPSIS_BANNER') newData = { ...DEFAULT_SYNOPSIS_BANNER };
        else if (type === 'PROMO_POPUP') newData = { ...DEFAULT_PROMO_POPUP };
        
        newData.startDate = campaignMeta.startDate;
        newData.dueDate = campaignMeta.dueDate;

        setAssets([...assets, { id: newId, type, name, data: newData }]);
        setActiveTabId(newId);
        setIsAddAssetModalOpen(false);
        setOpenAccordions({ ...openAccordions, banner: true }); 
      };

      const removeAsset = (id, e) => {
        e.stopPropagation();
        const filteredAssets = assets.filter(a => a.id !== id);
        setAssets(filteredAssets); 
        
        if (filteredAssets.length === 0) setActiveTabId(null);
        else if (activeTabId === id) setActiveTabId(filteredAssets[0].id);
      };

      const handleDownloadExtension = async () => {
        setExportState({ isExporting: true, progress: 10, msg: "최신 확장프로그램 패킹 준비 중..." });
        try {
          const zip = new window.JSZip();
          const filesToFetch = ["manifest.json", "background.js", "content.js"];
          const baseUrl = "https://raw.githubusercontent.com/btvcuration/campaign/main/Tool";

          for (let i = 0; i < filesToFetch.length; i++) {
            const fileName = filesToFetch[i];
            setExportState({ isExporting: true, progress: 10 + Math.floor((i / filesToFetch.length) * 60), msg: `${fileName} 가져오는 중...` });
            const response = await fetch(`${baseUrl}/${fileName}?t=${new Date().getTime()}`);
            if (!response.ok) throw new Error(`${fileName} 파일을 찾을 수 없습니다.`);
            zip.file(fileName, await response.text());
          }

          setExportState({ isExporting: true, progress: 85, msg: "압축 파일 생성 중..." });
          const blob = await zip.generateAsync({ type: "blob" });
          const downloadUrl = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = downloadUrl; link.download = `btv-campaign-extension-${new Date().toISOString().slice(0,10)}.zip`;
          document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(downloadUrl);
          
          setExportState({ isExporting: true, progress: 100, msg: "✅ 최신 버전 다운로드 완료!" });
          setTimeout(() => {
            setExportState({ isExporting: false, progress: 0, msg: '' });
            alert("확장 프로그램 다운로드가 완료되었습니다.\n기존 버전 삭제 후 새로 등록하시고 키보드 F5를 눌러 새로고침 해주세요!");
          }, 1500);
        } catch (e) {
          console.error("Extension Download Error:", e);
          setExportState({ isExporting: true, progress: 100, msg: "⚠️ 다운로드 실패" });
          setTimeout(() => setExportState({ isExporting: false, progress: 0, msg: '' }), 3000);
          alert("다운로드 중 오류가 발생했습니다: " + e.message);
        }
      };
      
      const handleExport = async () => {
        if (!assets || assets.length === 0) {
          if (campaignMeta.target !== 'TARGET') return alert("전송할 배너 기획안이 없고, 타겟팅 캠페인도 아닙니다.");
        }
        
        const isConfirmed = window.confirm("Jira 일감 전송을 시작하시겠습니까?\n\n확인(OK)을 누르면 화면 캡처가 시작됩니다.\n※ 주의: Jira에 미리 로그인이 되어있어야 정상 작동합니다.");
        if (!isConfirmed) return;

        const meta = campaignMeta || {};
        const myJiraId = localStorage.getItem('myJiraId') || '';
        if (!myJiraId) {
          alert("🚨 지라 전송을 위해 담당자 ID가 필요합니다!");
          return handleSettingsClick();
        }
        const cleanAssignee = myJiraId.split('@')[0].trim();

        setExportState({ isExporting: true, progress: 10, msg: "이미지 추출 준비 중..." });
        let capturedImages = {};

        // 🌟 수정: 세트형 배너는 다중 캡처 지원
        for (let i = 0; i < assets.length; i++) {
          const asset = assets[i];
          const currentProgress = 10 + Math.floor((i / assets.length) * 40); 
          
          setActiveTabId(asset.id);
          
          if (asset.type === 'GENERAL_SET_BANNER') {
            const colCount = asset.data?.colType === '3단' ? 2 : 3;
            let setImages = [];
            
            for (let c = 0; c < colCount; c++) {
              setExportState({ isExporting: true, progress: currentProgress, msg: `[${asset.name}] 세트 ${c+1}/${colCount} 캡처 중...` });
              handleAssetChange(asset.id, 'selectedCardIndex', c);
              await new Promise(r => setTimeout(r, 1000)); // UI 업데이트 대기
              
              const element = document.getElementById('capture-preview-area');
              if (element) {
                const rect = element.getBoundingClientRect();
                const dataUrl = await new Promise((resolve) => {
                  const timeout = setTimeout(() => resolve(null), 3000);
                  const listener = (e) => { clearTimeout(timeout); window.removeEventListener('RECEIVE_SCREENSHOT', listener); resolve(e.detail.dataUrl); };
                  window.addEventListener('RECEIVE_SCREENSHOT', listener);
                  window.dispatchEvent(new CustomEvent('REQUEST_SCREENSHOT', { detail: { x: rect.left, y: rect.top, width: rect.width, height: rect.height } }));
                });
                if (dataUrl) setImages.push(dataUrl);
              }
            }
            capturedImages[asset.id] = setImages;
          } else {
            setExportState({ isExporting: true, progress: currentProgress, msg: `[${asset.name}] 캡처 진행 중...` });
            await new Promise(r => setTimeout(r, 800)); 
            
            const element = document.getElementById('capture-preview-area');
            if (element) {
              const rect = element.getBoundingClientRect();
              const dataUrl = await new Promise((resolve) => {
                const timeout = setTimeout(() => resolve(null), 3000);
                const listener = (e) => { clearTimeout(timeout); window.removeEventListener('RECEIVE_SCREENSHOT', listener); resolve(e.detail.dataUrl); };
                window.addEventListener('RECEIVE_SCREENSHOT', listener);
                window.dispatchEvent(new CustomEvent('REQUEST_SCREENSHOT', { detail: { x: rect.left, y: rect.top, width: rect.width, height: rect.height } }));
              });

                <div className="p-6 border-b border-[#262833] flex justify-between items-center bg-[#0f111a]">
                  <h3 className="text-xl font-black text-white flex items-center gap-2"><LayoutTemplate size={22} className="text-[#4f3df6]"/> Select Template</h3>
                  <button onClick={() => setIsAddAssetModalOpen(false)} className="p-1.5 hover:bg-[#262833] rounded-full text-slate-400 hover:text-white transition-colors"><X size={20}/></button>
                </div>
                <div className="p-8 grid grid-cols-2 lg:grid-cols-3 gap-5 max-h-[70vh] overflow-y-auto custom-scrollbar bg-[#0a0812]">
                  {BANNER_SPECS.map((spec) => (
                    <div key={spec.type} onClick={() => addAsset(spec.type, spec.name)} className="bg-[#1a1c26] border border-[#262833] rounded-2xl p-6 cursor-pointer hover:border-[#4f3df6] hover:-translate-y-1 hover:shadow-[0_10px_30px_rgba(79,61,246,0.2)] transition-all flex flex-col h-full group">
                      <div className="flex items-start justify-between mb-4"><div className="p-3 bg-[#0a0812] border border-[#303340] rounded-xl text-[#7387ff] group-hover:bg-[#4f3df6] group-hover:border-[#4f3df6] group-hover:text-white transition-colors"><spec.icon size={24} /></div><span className="text-[10px] font-bold bg-[#0a0812] border border-[#303340] text-slate-400 px-2 py-1 rounded-md font-mono">{spec.ratio}</span></div>
                      <h4 className="text-lg font-bold text-white mb-1 group-hover:text-[#7387ff] transition-colors">{spec.name}</h4>
                      <p className="text-xs text-slate-500 leading-relaxed mt-auto pt-4 border-t border-[#262833]">{spec.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }
    const root = createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
